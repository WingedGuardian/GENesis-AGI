[project]
name = "genesis-v3"
version = "3.0.0b19"
requires-python = ">=3.12,<3.15"  # upper bound: every current litellm release caps Python <3.15
dependencies = [
    "aiosqlite",
    "aiohttp>=3.14.1",  # security floor — 3.14.1 fixes 11 advisories (cookie leak on redirect, several DoS,
                       # multipart header injection). Genesis is client-only; the aioresponses/ClientResponse
                       # stream_writer-kwarg mismatch is absorbed by the tests/test_observability/conftest.py shim.
    "apscheduler>=3.11,<4",
    "regex",  # procedure_advisor runs author regexes with a per-pattern timeout (re has none)
    "tzlocal>=5",  # transitive dep of apscheduler (ego/cadence uses the local-timezone path); declare so a clean/cached install can't drop it
    "python-telegram-bot>=21.0",
    "litellm==1.100.4",  # pinned EXACTLY — 1.82.7/1.82.8 contained malware, so never float.
                       # 1.93.2 admits Python 3.14 and fixes PYSEC-2026-4066, which is
                       # present in 1.93.0. pip-audit, 2026-10-13: no known
                       # advisories. Like every current release it caps Requires-Python <3.15,
                       # which is why requires-python above carries the same ceiling.
    "qdrant-client>=1.15,<1.16",  # MUST track the SERVER. scripts/install.sh DEFAULTS to installing
                                  # Qdrant 1.14.0 when none is present (QDRANT_VERSION is overridable,
                                  # and an existing server of any version is left alone) — so this is
                                  # a hard client bound against a soft server default.
                                  # Qdrant's rule (qdrant_client/common/version_check.py) is same
                                  # major, |minor difference| <= 1: a 1.14 server admits a 1.13-1.15
                                  # client. The CEILING follows from that rule. The FLOOR is 1.15
                                  # because it is the newest admitted release and so carries the most
                                  # fixes — widening it to >=1.13 would change nothing in practice,
                                  # since resolution takes the highest satisfying version either way.
                                  # Left unpinned this resolved to whatever was latest (1.17.1 here,
                                  # 1.19.0 available) and every client start logged an incompatibility
                                  # warning. The drift is not cosmetic: the 1.16 line DROPPED
                                  # QdrantClient.search() (VERIFIED: present 1.15.1, absent 1.16.0),
                                  # which memory/health.py still called. Genesis's whole API surface
                                  # (query_points/scroll/retrieve/upsert/set_payload/payload indexes;
                                  # no sparse or named vectors) predates 1.14, so this costs nothing.
                                  # BUMP BOTH TOGETHER or not at all — locked by
                                  # tests/test_scripts/test_dependency_pins.py, which re-derives the
                                  # coupling from this line AND install.sh rather than trusting it.
                                  #
                                  # KNOWN LIMIT, stated rather than hidden: this bound tracks the
                                  # SHIPPED DEFAULT server, and install.sh does not force that server
                                  # on anyone — QDRANT_VERSION is overridable, QDRANT_URL may point at
                                  # a remote of any version, and an already-running server is left
                                  # alone. An install deliberately on a NEWER server gets a client
                                  # that is now too old, and a later `pip install -e .` will pull it
                                  # back down. That is a real cost and it is the reason this comment
                                  # exists: if you run a non-default server, move BOTH this specifier
                                  # and QDRANT_VERSION to match it (the test above will tell you when
                                  # the pair is wrong). Such an install is not made WORSE by the pin —
                                  # unpinned it would resolve to the newest release (1.19.0 today),
                                  # which is further from a 1.17 server than 1.15 is — but it does
                                  # lose the ability to just install a matching client by hand.
                                  # The deeper problem is that the right client depends on the server
                                  # version, which is unknown at dependency-resolution time; a static
                                  # bound is the best instrument available here, not a complete one.
    "pydantic>=2.12,<3",  # strict validation for the decision registry (already pulled in by fastapi, litellm and mcp)
    "pyyaml",
    "a2a-sdk==1.2.2",
    "claude-agent-sdk==0.2.172",  # live_agent: drives a persistent Claude Code session (query/steer/interrupt/
                                  # can_use_tool). Pinned exactly: the wire contract it speaks to the CLI moves
                                  # between releases. The wheel bundles its own CLI (~280 MB); live_agent runs the
                                  # install's pinned `claude` instead (cli_path), so the bundle is unused.
                                  # Core, not an extra, so update.sh installs it with no operator step;
                                  # move it to an extra if the ~280 MB matters before live_agent ships.
    "markdown-it-py>=3",  # the merge gate's rework row reads PR bodies as CommonMark (already pulled in by rich)
    "httpx",
    "diskcache>=5.6",
    "beautifulsoup4",
    "html2text",
    "lxml",
    "flask>=3.0",
    "dateparser>=1.4.1,<2",  # natural-language `preferred_timing` resolution for
                           # scheduled outreach (genesis.outreach.timing): "tomorrow
                           # 9am", "in 2 hours" → UTC. Without it a raw NL string
                           # was stored verbatim in pending_outreach.deliver_after
                           # and never fired (lexicographic compare vs UTC ISO now).
    "flask-sock>=0.7",
    "wsproto>=1.2",  # transitive dep of flask-sock; pin to prevent silent uninstall
    "fastmcp>=4.1.4,<5",  # Qualified v4 API and security floor; no background-tasks extra.
    "mcp>=2.3.0,<3",  # Direct SDK floor; FastMCP v4 requires the v2 protocol implementation.
    "detect-secrets>=1.4",  # Phase 6 contribution sanitizer — REQUIRED floor. sanitize.py fails closed if missing.
    "pymupdf>=1.27",  # PDF text extraction for knowledge ingestion pipeline
    "scrapling>=0.4.7",  # Web fetching with TLS fingerprint impersonation
    "tldextract>=5",  # Public Suffix List (bundled snapshot): the cookie tools refuse to clear a public suffix
    "curl_cffi>=0.15.0",  # curl_cffi backend for Scrapling's AsyncFetcher
    "yt-dlp[default]>=2026.08.19",  # YouTube metadata + transcripts (knowledge/processors/youtube.py,
                                    # behind the web_fetch MCP tool). The `default` extra brings the
                                    # JavaScript challenge solver (yt-dlp-ejs) at the exact version this
                                    # yt-dlp release pins, installed locally: never fetched at run time.
    "networkx>=3.0",  # In-memory graph for memory_links traversal + algorithms
    "wyoming>=1.5",  # Wyoming protocol for HA voice satellite STT/TTS integration
    "falkordb>=1.7.1,<2",  # Graph-engine client for the memory graph. CORE, like
                           # qdrant-client above: the graph engine is part of the memory
                           # architecture, not an optional add-on. `config/graphstore.yaml`
                           # defaulting to networkx is a STAGED CUTOVER, not optionality.
                           # Its own pin is redis<9,>=8.0.0, so the line below is not an
                           # independent choice — declaring falkordb mandates redis 8.
    "redis>=8,<9",  # Required by falkordb and the first-party engine-health probe.
                    # FastMCP no longer supplies this through its optional task worker.
    # Transitive deps pinned to secure floors (audit #638) so a clean/cached install can't resolve a vulnerable version
    "urllib3>=2.7.0",  # via qdrant-client/requests — CVE-2026-44431/44432 (auth-header leak, decompression DoS)
    "idna>=3.15",  # via httpx/requests — CVE-2026-45409 (quadratic-processing DoS)
    "certifi>=2026.5.20",  # via httpx/curl_cffi — current CA bundle
]

[project.optional-dependencies]
transcript-analytics = ["duckdb==1.5.6", "pyarrow==24.0.0"]
# `test` and `payments` are installed on every install, after the core packages
# and as a separate non-fatal step (scripts/lib/venv_setup.sh install_runtime_extras;
# the list is INSTALL_EXTRAS in scripts/lib/venv_matches_pyproject.py): an install
# runs its own test suite, and the card vault needs the payments packages.
test = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-timeout",
    # Property tests exercise hook-output budget invariants across Unicode edges.
    "hypothesis>=6.0",
    "aioresponses>=0.7.7",
    # tests/test_hooks/test_edit_verify_advisory.py executes the real hook,
    # which shells out to the venv's ruff — CI's test job installs only this
    # extra, so ruff must be here (the lint job installs its own copy).
    "ruff>=0.5",
    # tests/test_dashboard/test_dashboard_css_isolation.py parses the shipped
    # stylesheets. A hand-rolled CSS parser inside that guard failed OPEN twice —
    # once on a brace inside a `url()`, once on a rule nested in `@media` — so
    # the parser is a dependency rather than a regex.
    "tinycss2>=1.3",
    # tests/test_payments exercise the real card vault crypto and passphrase check.
    "pyrage>=1.4",
    "zxcvbn>=4.5",
]
# Installed on every install, after the core packages and as a separate non-fatal
# step (scripts/bootstrap.sh, scripts/install.sh); the engine and Chromium these
# packages pin are then downloaded by scripts/install_browser_stack.sh
# (genesis-browser-stack.service). playwright and patchright live ONLY here, never
# in the core list: a core install that moved playwright to 1.62 would break a
# camoufox < 0.5 engine the browser step has not replaced yet (measured:
# "Protocol error (Browser.setDefaultViewport)").
browser = [
    "camoufox>=0.5.7,<0.6",  # engine pinned by the package's browser-pin.json (Firefox 156).
                             # Upper bound: 0.4 -> 0.5 shipped no migration guide and changed
                             # the engine layout; take the next minor deliberately.
    "playwright>=1.62,<1.63",  # camoufox 0.5.7 and 0.5.8 declare playwright<1.63.
    "patchright>=1.62.1,<1.63",  # Chromium fallback layer (hides the Runtime.enable CDP signal).
                                 # <1.63 so it ships the SAME Chromium build as playwright 1.62
                                 # (151, build 1234; patchright 1.63 ships 153/1243): one download,
                                 # and the profile is never opened by two Chromium versions.
]
voice = [
    "openai[realtime]>=2.20",  # GPT-Realtime API for speech-to-speech voice sessions
]
distribution = [
    "composio-client>=1.33.0",
]
documents = [
    "pageindex>=0.2.8",
]
payments = [
    # The encrypted card vault (`python -m genesis vault`): age encryption and
    # passphrase strength. Imported only by genesis.payments, at call time.
    "pyrage>=1.4",
    "zxcvbn>=4.5",
]
release = []  # detect-secrets is now a core dep (see dependencies above)

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Agentic-gauntlet fixtures are INTENTIONALLY broken Python projects (the model's
# job is to fix them) — never lint them, or CI would fail on the planted bugs.
extend-exclude = ["src/genesis/eval/gauntlet_fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear (catches common gotchas)
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security) — see the documented ignores below
]
ignore = [
    "E501",  # line length (handled by formatter)
    # S603/S607 flag EVERY subprocess call regardless of safety; this codebase
    # shells to git/gh/ruff by design. The real shell-risk rule, S602
    # (shell=True), stays ENABLED.
    "S603", "S607",
    # S110/S112 (try-except-pass/continue): most hits implement the deliberate
    # "hooks/best-effort telemetry never crash" convention. A linter cannot
    # distinguish that from bad swallowing in data-returning code — the review
    # protocol + CODE_AUDITOR taxonomy own that class with judgment. This is a
    # documented trade, not noise cleanup (user-accepted 2026-07-10).
    "S110", "S112",
    # S311 (non-crypto random): all uses are timing jitter / sampling / backoff
    # (browser stealth, retry spread). No token or secret generation uses
    # `random` — re-grep before adding any such use; use `secrets` there.
    "S311",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fake credentials, /tmp literals, chmod fixtures,
# subprocess/shell fixtures, and literal fixture SQL by nature.
"tests/**" = ["S101", "S105", "S106", "S108", "S103", "S324", "S602", "S608"]
# Parametrized dynamic-WHERE builder pattern: SQL fragments are literal
# strings assembled in code; user values are ALWAYS bound parameters. S608
# stays live outside these data-access layers.
"src/genesis/db/crud/*" = ["S608"]
"src/genesis/dashboard/routes/*" = ["S608"]
# Schema/data migrations assemble literal SQL fragments (often from module-level
# constants); they run at deploy against the schema and NEVER take runtime user
# input, so S608 is a false positive here — same data-access-layer rationale as
# db/crud/*. (0053's f-string UPDATE uses a trusted literal _WHERE constant.)
"src/genesis/db/migrations/*" = ["S608"]
# Type-narrowing asserts in MCP handlers (follow-up: convert to explicit raises).
"src/genesis/mcp/memory/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Explicit, so pytest-asyncio stops warning that it is unset (pytest 9.2 prints
# that warning ahead of everything, including tests/conftest.py's own first
# line). Unset, an async fixture's loop scope falls back to the fixture's own
# caching scope; every async fixture under tests/ is function-scoped (none passes
# `scope=` or `loop_scope=`), so "function" changes no fixture's loop. An async
# fixture that needs a wider loop must now pass `loop_scope=` itself.
asyncio_default_fixture_loop_scope = "function"
# Remove a PASSING test's tmp_path at that test's teardown; keep only failures'
# for debugging. Without it every run with its own --basetemp keeps every test
# directory forever (pytest clears a basetemp only when the same name is
# reused): MEASURED on one install, 131 such basetemps, 10.2 GB, in 7 days.
# The removal is best-effort (rmtree with ignore_errors), so it never fails a
# test. Limits, both pytest's or the conftest's rather than this setting's: a
# test that errors in SETUP or TEARDOWN (not in its body) counts as passed for
# this purpose, so its directory is removed too; and a default local run
# (tests/conftest.py's basetemp redirect) removes its whole basetemp at exit,
# failures included, as it did before. To keep everything, run with an explicit
# --basetemp and `-o tmp_path_retention_policy=all`.
# Pinned by tests/test_pytest_retention_policy.py.
tmp_path_retention_policy = "failed"
# PER-TEST ceiling (pytest-timeout), not a suite budget. With the thread method
# below, a test that exceeds it dumps every thread's stack and ENDS THE RUN: the
# suite does not carry on.
#
# It applies wherever pytest-timeout is installed: always in CI (the test job
# installs the [test] extra), and locally only in a venv where someone
# installed it, because no install path installs that extra. Where it is
# absent, tests/conftest.py says so at the top of the run.
#
# 600 s, lowered from 3600 (2026-10). A hung test holds the box-wide pytest
# lock (genesis.util.pytest_lock) until this kills it, and every other
# session's run waits behind it: MEASURED, one hung mutation-sweep test held the
# lock for 53 minutes with six runs queued. The slowest of 40,306 tests in CI
# run 37962484661 (main, 2026-10-09, --durations) took 38.25 s, so 600 s is
# about 16 times the slowest real test. Read the --durations block before
# lowering it further. Raising it again costs every session on a shared box
# the full value per hung test.
timeout = 600
# "thread", not the default "signal". MEASURED 2026-10: two CI test jobs
# (38948727801, 39044594350) froze at the same point, just after
# tests/test_peers/test_cli.py, for over two hours until the 180-minute job limit
# cancelled them; the signal method never fired. A signal handler runs only when
# the main thread executes Python code, and its exception can be absorbed by the
# code it interrupts. The thread method uses a watchdog thread that dumps all
# stacks and exits the process, so a hang fails in 600 s with the stack trace
# that names it. Cost: one hang ends the whole run instead of failing one test.
# The box-wide pytest lock is an flock, released when the process dies.
timeout_method = "thread"
