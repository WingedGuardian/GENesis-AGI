# Phase 8: Outreach pipeline configuration

quiet_hours:
  # DISABLED by default. start == end is a zero-width window, which
  # outreach/governance.py::_in_quiet_hours treats as "quiet hours off".
  #
  # Why off: the feature had no off switch and no way to say "send this anyway",
  # so an explicitly-scheduled reminder due at 01:30 local was held until the
  # window closed at 07:00. ALERT and BLOCKER always bypassed it; everything else
  # (notification, digest, content, surplus, marketing) was delayed silently.
  #
  # To enable, set real local times — e.g. start "22:00", end "07:00" (a window
  # that crosses midnight is handled). Times are local; the timezone is inherited
  # from genesis.yaml `timezone` via user_timezone(), not set here.
  #
  # HAZARD, set BOTH keys together. The local-overlay merge
  # (genesis/_config_overlay.py::_deep_merge) is PER-KEY, so an
  # outreach.local.yaml containing only `quiet_hours: {end: "07:00"}` leaves
  # start at 00:00 and yields a live 00:00–07:00 window — quiet hours silently
  # back ON, with nothing announcing it. An explicit `enabled:` boolean would be
  # immune; that is the proper redesign, deliberately deferred (issue #1958).
  # Until then: re-enable by setting start AND end, and disable by setting them
  # equal.
  #
  # A malformed value (not HH:MM) is treated as DISABLED and logged — it does not
  # raise. Nothing validates this field yet, and raising here retried forever.
  start: "00:00"
  end: "00:00"

channel_preferences:
  default: telegram
  blocker: telegram
  alert: telegram
  surplus: telegram
  digest: telegram
  # Autonomous CLI approval prompts route to Telegram so the user can tap
  # the inline ✅ button (or reply with "approve" in the Approvals topic).
  approval: telegram
  # Content drafts for user review — routed to Content Review topic.
  content: telegram
  # Ego notifications — informational, no approval needed. Routed to default topic.
  notification: telegram
  # Marketing campaign updates — routed to the dedicated Marketing topic.
  marketing: telegram

thresholds:
  blocker: 0.0
  alert: 0.3
  surplus: 0.7
  digest: 0.0
  # Approvals bypass the salience gate entirely — if the approval gate
  # asked for confirmation, the user always needs to see it.
  approval: 0.0
  # Content review always delivers — manual review is the quality gate.
  content: 0.0
  # Ego notifications always deliver — the ego already judged relevance.
  notification: 0.0
  # Marketing digests are owner-facing + only sent when material, so 0.0 exempts
  # them from the salience gate (still subject to quiet-hours + the shared daily
  # cap, like notification/content — marketing is not in _BYPASS_CATEGORIES).
  marketing: 0.0

rate_limits:
  max_daily: 5
  surplus_daily: 1
  content_daily: 3
  notification_daily: 10

morning_report:
  trigger_time: "07:00"
  # timezone omitted — inherits genesis.yaml `timezone` via user_timezone()

engagement:
  timeout_hours: 24
  poll_interval_minutes: 60

# Delivery routing: where each category delivers.
# Values: "supergroup" (to forum topic), "dm" (direct message), "both".
# When forum_chat_id is not configured, "supergroup" degrades to DM.
delivery_routing:
  default: supergroup
  # Approvals deliver exclusively to the supergroup Approvals topic —
  # never DM.  Grouping them in one topic keeps the inline-button UX
  # coherent and makes the "approve all N pending" button meaningful.
  approval: supergroup
  # Content review goes to dedicated topic — never DM.
  content: supergroup
  # Ego notifications are the ego "talking to" the user — informational,
  # not an official proposal. They belong in the private DM, never a
  # supergroup topic. (Official proposals go to the Ego Proposals topic.)
  notification: dm
  # Marketing updates go to the dedicated Marketing topic — never DM. Pinned
  # explicitly (not left to `default`) so it holds on installs whose default is dm.
  marketing: supergroup

health_alerts:
  # Only these alert IDs go to Telegram (CRITICAL severity only).
  # Everything else is internal (dashboard + morning report + awareness).
  # NOTE: service:bridge_down is intentionally absent — if the bridge is dead,
  # the Telegram adapter is also dead, so the alert can never be delivered.
  immediate_escalation:
    - "infra:disk_low"
    - "infra:container_memory_high"
    - "cc:quota_exhausted"
    - "provider:embedding_failing"
    - "provider:qdrant_unreachable"
    - "awareness:tick_overdue"
    # A blind health system IS a highest-severity page: this is the ONLY alert
    # emitted when HealthDataService is uninitialised (errors.py early-return),
    # it is Sentinel-remediable (restart), and dropping it here silenced it.
    # (Contrast provider:credit_exhaustion, deliberately absent — that is now a
    # dashboard-only WARNING; refilling credits is a user financial action.)
    - "service:health_data_uninitialized"
    # Prefixes. This list REPLACES the code default when present, so anything the
    # default escalates must be repeated here. backup: was missing (backup-failure
    # alerts were silently non-escalating); creds: is new for G.1.
    - "backup:"
    - "creds:"

# Voice proactive chiming — the spoken-aloud allowlist (THE menu).
# A request is spoken through the Voice PE only if its signal_type or a
# source_id part matches one of these by prefix (OutreachPipeline._should_voice).
# Everything still goes to Telegram regardless — this only controls what
# interrupts the user out loud during `hours`. This block is authoritative;
# editing it changes behavior on next server restart. Keep entries specific
# (prefix match) and keep the `task_*` entries in sync with the signal_type
# values set in src/genesis/autonomy/executor/engine.py _notify.
voice:
  alert_ids:
    # Memory-system + resource emergencies (matched via source_id)
    - "infra:disk_low"
    - "infra:container_memory_high"
    - "provider:embedding_failing"
    - "provider:qdrant_unreachable"
    - "awareness:tick_overdue"
    # Autonomous system needs your decision (matched via signal_type)
    - "sentinel_escalation"
    - "sentinel_approval"
    - "sentinel_action_approval"
    # Autonomous task reached an attention-worthy state (complete / alert).
    # `task_progress` is intentionally omitted — routine progress pings go to
    # Telegram only and never interrupt by voice.
    - "task_complete"
    - "task_alert"
  hours: [9, 2]   # 9am-2am local (wraps midnight); end hour exclusive
