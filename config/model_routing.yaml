providers:
  ollama-3b:
    type: ollama
    model: qwen2.5:3b
    profile: qwen2.5-3b
    base_url: ${OLLAMA_URL:-http://localhost:11434}
    free: true
    enabled: ${GENESIS_ENABLE_OLLAMA:-true}
    keep_alive: -1
    open_duration_s: 60
  ollama-embedding:
    type: ollama
    model: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b-fp16}
    base_url: ${OLLAMA_URL:-http://localhost:11434}
    free: true
    enabled: ${GENESIS_ENABLE_OLLAMA:-true}
    keep_alive: -1
    open_duration_s: 60
  mistral-large-free:
    type: mistral
    model: mistral-large-latest
    profile: mistral-large-3
    # `free` is account-tier semantics — what THIS account pays, not the model's
    # list price (see _detect_mislabeled_free_openrouter's docstring in
    # routing/config.py). Flipped to false 2026-09: Mistral removed Large from
    # free-tier entitlement (403 tier_not_allowed measured on two independent
    # free-tier accounts 2026-08-27, confirmed by Mistral support), and paid-plan
    # pricing is $0.5/$1.5 per MTok — so cost is tracked at real rates and
    # never_pays chains exclude it. If an install's account tier genuinely
    # entitles Large at $0, override free: true in the local overlay. The
    # provider NAME keeps its historical "-free" suffix deliberately: 30
    # call-site chains reference it, and an in-place semantic fix beats a
    # rename churn (same reasoning as the groq-free alias below).
    free: false
    rpm_limit: 4
    open_duration_s: 120
  mistral-small-free:
    type: mistral
    model: mistral-small-latest
    profile: mistral-small
    free: true
    rpm_limit: 30
    open_duration_s: 120
  groq-free:
    # Migrated 2026-08-06: Groq deprecated llama-3.3-70b-versatile (shutdown
    # 2026-08-16) → openai/gpt-oss-120b, Groq's recommended replacement on the
    # same free-tier bucket (30 RPM / 1K RPD). Alias name kept deliberately: 32
    # call-site chains + 8 code refs resolve `groq-free`, so an in-place repoint
    # migrates all of them with zero churn. Benchmarked vs the llama baseline
    # (config/eval_datasets): structured_output + extraction parity (100% / 67%),
    # a mild triage-depth under-bias on classification (exact-match-exaggerated;
    # reasoning_effort=medium gave no gain, so kept low). gpt-oss-120b is a
    # reasoning model, but Groq returns reasoning in a separate field — content
    # stays clean JSON with no suppression param (verified 10/10 structured_output
    # across param variants). reasoning_effort:low just caps reasoning-token volume
    # to stay under the free-tier TPM ceiling.
    type: groq
    model: openai/gpt-oss-120b
    profile: gpt-oss-120b
    free: true
    rpm_limit: 30
    open_duration_s: 120
    params:
      extra_body:
        reasoning_effort: low
  # NOTE (2026-08-07): the standalone groq-oss-120b GROUNDWORK alias was removed
  # here — its purpose (a free gpt-oss-120b reasoning hop) is now fulfilled by
  # groq-free itself, which serves openai/gpt-oss-120b after the 2026-08-06 llama
  # migration. Two aliases on one shared Groq free-tier bucket with independent
  # circuit breakers was a redundant footgun; consolidated to groq-free.
  gemini-free:
    type: google
    # GA stable (was gemini-3-flash-preview; gemini-3.5-flash is Google's own
    # recommended replacement for that preview — escape preview deprecation churn).
    model: gemini-3.5-flash
    profile: gemini-3.5-flash
    free: true
    rpm_limit: 15
    open_duration_s: 120
    # gemini-3.5-flash reasons by default (~70-90 thinking tokens even on trivial
    # prompts → empty content at tight max_tokens + free-tier TPM bloat). This is
    # the fast-flash lane (fact extraction, tagging, surplus brainstorm), so
    # suppress thinking. reasoning_effort=disable → Gemini thinkingBudget=0
    # (verified live 2026-06-23: content correct, 0 reasoning tokens at mt=20).
    params:
      reasoning_effort: disable
  openrouter-free:
    # Curated free-pool hop (2026-08-07): repointed off qwen/qwen-2.5-72b-instruct
    # — that BARE slug is PAID on OpenRouter (~$0.36/$0.40 per MTok, verified live)
    # yet was flagged free:true since the public release, so a successful call
    # billed while the router recorded $0 (is_free zeroes cost). Now a curated
    # OpenRouter free pool: primary gemma-4-26b-a4b:free (10/10 on the
    # structured_output golden set, token-efficient), server-side failover to
    # nemotron-3-super-120b:free (10/10 with token headroom). Both :free ⇒
    # genuinely $0. The extra_body.models array is OpenRouter's fallback across
    # ONLY these vetted models — deliberately NOT the openrouter/free auto-router,
    # which routes onto JSON-broken tiny/safety models (measured 6/10). If both
    # die, Genesis's own chain fallback takes over.
    type: openrouter
    model: google/gemma-4-26b-a4b-it:free
    profile: gemma-4-26b
    free: true
    rpm_limit: 20
    open_duration_s: 120
    params:
      extra_body:
        models:
          - google/gemma-4-26b-a4b-it:free
          - nvidia/nemotron-3-super-120b-a12b:free
  openrouter-haiku:
    type: openrouter
    model: anthropic/claude-haiku-4.5
    profile: claude-haiku-4.5
    free: false
    rpm_limit: 20
    open_duration_s: 120
  openrouter-sonnet:
    type: openrouter
    model: anthropic/claude-sonnet-4.6
    profile: claude-sonnet-4.6
    free: false
    rpm_limit: 20
    open_duration_s: 120
  openrouter-opus:
    type: openrouter
    model: anthropic/claude-opus-4.6
    profile: claude-opus-4.6
    free: false
    rpm_limit: 20
    open_duration_s: 120
  # ── Phase 2 providers (gated on eval before chain promotion) ──
  nvidia-nim-deepseek:
    type: nvidia_nim
    model: deepseek-ai/deepseek-v4-flash-0731
    profile: nvidia-nim-deepseek-v4-flash-0731
    free: true
    rpm_limit: 20  # NIM free tier ~40 RPM per-model (verified 2026-08); 20 = conservative floor
    open_duration_s: 120
  # cerebras DISABLED — all models removed from Cerebras as of 2026-05.
  # Only reasoning-only models remain (gpt-oss-120b, zai-glm-4.7) which
  # return 'reasoning' field instead of 'content', incompatible with LiteLLM.
  # Re-enable when Cerebras adds standard chat models or LiteLLM adds support.
  # cerebras-glm:
  #   type: cerebras
  #   model: zai-glm-4.7
  #   profile: cerebras-glm47
  #   free: true
  #   rpm_limit: 10
  #   open_duration_s: 120
  github-o3mini:
    type: github
    model: o3-mini
    profile: github-o3-mini
    free: true
    # Disabled: GitHub Models API does not currently serve o3-mini
    # (only gpt-4o, gpt-4o-mini, Llama 3.1 available as of 2026-04-14)
    enabled: false
    rpm_limit: 10
    open_duration_s: 120
  openrouter-gemma4:
    type: openrouter
    model: google/gemma-4-31b-it:free
    profile: gemma-4-31b
    free: true
    rpm_limit: 20
    open_duration_s: 120
  # NOTE (2026-08-07): openrouter-qwen3coder removed — its qwen/qwen3-coder:free
  # slug is delisted (0 OpenRouter endpoints, verified live) and it was wired
  # into no chain, so it was dead weight. Drop rather than repoint.
  openrouter-deepseek-v4:
    type: openrouter
    model: deepseek/deepseek-v4-pro
    profile: deepseek-v4-pro
    free: false
    rpm_limit: 20
    open_duration_s: 120
  openrouter-deepseek-v4-flash:
    type: openrouter
    model: deepseek/deepseek-v4-flash
    profile: deepseek-v4-flash
    free: false
    rpm_limit: 20
    open_duration_s: 120
  openrouter-gpt55:
    type: openrouter
    model: openai/gpt-5.5
    profile: gpt-5.5
    free: false
    rpm_limit: 20
    open_duration_s: 120
  openrouter-mimo:
    # 2026-08-07: repointed xiaomi/mimo-v2-pro (delisted, 0 endpoints, verified
    # live) → mimo-v2.5-pro (7 live endpoints). Last fallback rung of the
    # currently-disabled 36_code_auditor, so correctness hygiene, not an active fix.
    type: openrouter
    model: xiaomi/mimo-v2.5-pro
    profile: mimo-v2.5-pro
    free: false
    rpm_limit: 20
    open_duration_s: 120
  deepseek-chat:
    type: deepseek
    model: deepseek-chat
    profile: deepseek-v3
    free: false
    # Deprecated: use openrouter-deepseek-v4 or v4-flash instead
    enabled: false
    open_duration_s: 120
  openai-gpt5:
    type: openai
    model: gpt-5.4
    profile: gpt-5.4
    free: false
    open_duration_s: 120
  xai-grok:
    type: xai
    model: grok-3-mini
    profile: grok-3-mini
    free: false
    open_duration_s: 120
  qwen-plus:
    type: qwen
    model: qwen3.5-plus
    profile: qwen-3.5-plus
    free: false
    open_duration_s: 120
  glm51:
    type: zenmux
    model: z-ai/glm-5.1
    profile: glm-5.1
    base_url: https://zenmux.ai/api/v1
    free: false
    open_duration_s: 120
  minimax-m25:
    type: minimax
    model: MiniMax-M2.7
    profile: minimax-m2.7
    base_url: https://api.minimaxi.com/v1
    free: false
    open_duration_s: 120
  openrouter-nemo:
    type: openrouter
    model: mistralai/mistral-nemo
    profile: mistral-nemo
    free: false
    rpm_limit: 20
    open_duration_s: 120
  gpt-5.4:
    type: openrouter
    model: openai/gpt-5.4
    profile: gpt-5.4
    free: false
    open_duration_s: 120
  kimi-k2.5:
    type: openrouter
    model: moonshotai/kimi-k2.6
    profile: kimi-k2.6
    free: false
    rpm_limit: 20
    open_duration_s: 120
  openrouter-qwen36plus:
    type: openrouter
    model: qwen/qwen3.6-plus
    profile: qwen-3.6-plus
    free: false
    rpm_limit: 20
    open_duration_s: 120
  lmstudio-30b:
    type: lmstudio
    model: mistral-small-3.2-24b-instruct-2506
    profile: mistral-small-3.2-24b
    base_url: ${LM_STUDIO_URL:-http://localhost:1234/v1}
    free: true
    enabled: ${GENESIS_ENABLE_LM_STUDIO:-false}
    open_duration_s: 120
call_sites:
  3_micro_reflection:
    chain:
    - mistral-small-free
    - openrouter-free
    - mistral-large-free
    - groq-free
    - gemini-free
    # Additional free providers so an essential reflection (3_micro_reflection
    # is in degradation._L3_KEEP) survives a broad free-tier outage without
    # paid fallback. Healthy OpenRouter-free models first; NIM-flash last
    # (free ~40 RPM per-model, historically flaky).
    - openrouter-gemma4
    - nvidia-nim-deepseek
    retry_profile: background
  4_light_reflection:
    chain:
    - gemini-free
    - groq-free
    - mistral-large-free
    default_paid: false
    never_pays: true
  5_deep_reflection:
    chain:
    - openrouter-sonnet
    default_paid: true
    retry_profile: background
    cc_model: Sonnet
    dispatch: cli
  6_strategic_reflection:
    chain:
    - openrouter-opus
    default_paid: true
    retry_profile: background
    cc_model: Opus
    dispatch: cli
  # NOTE (2026-07-13): legacy ego sites 7_ego_cycle + 8_ego_compaction were
  # REMOVED here. #26 ("Phase A — ephemeral sessions") split the ego into two
  # (recording under 7_user_ego_cycle / 7_genesis_ego_cycle, both CC-dispatched)
  # and made compaction deterministic (no LLM). Both YAML entries were orphaned —
  # the backend snapshot emitted them as phantom "healthy but never active" tiles.
  9_fact_extraction:
    chain:
    - groq-free
    - gemini-free
    - nvidia-nim-deepseek
    - mistral-large-free
    - openrouter-deepseek-v4-flash
  # V4 placeholder: cognitive state IS actively maintained today, but via direct
  # DB writes (awareness/loop.py, cc/reflection_bridge*.py), NOT this call site.
  # This entry reserves a routing chain for the future LLM-summary regeneration feature.
  10_cognitive_state:
    chain:
    - glm51
    - openrouter-sonnet
    default_paid: true
  11_user_model_synthesis:
    chain:
    - mistral-small-free
    - groq-free
    - gemini-free
    - openrouter-free
    retry_profile: background
  12_surplus_brainstorm:
    chain:
    - gemini-free
    - mistral-large-free
    - groq-free
    - openrouter-free
    - nvidia-nim-deepseek
    never_pays: true
  13_morning_report:
    chain:
    - mistral-large-free
    - groq-free
    - gemini-free
    - openrouter-free
  14_weekly_self_assessment:
    chain:
    - openrouter-opus
    default_paid: true
    dispatch: cli
    cc_model: Opus
  16_quality_calibration:
    chain:
    - openrouter-sonnet
    default_paid: true
    dispatch: cli
    cc_model: Sonnet
  # Executor Gate 2 deliverable-quality review leads with paid V4-pro
  # (openrouter-deepseek-v4): a user-chosen pro-grade lever for this quality gate,
  # since NIM's free tier now serves flash (not pro) after the 2026-08 repoint.
  # Free NIM flash + paid v4-flash + qwen remain as fallbacks.
  17_executor_review:
    chain:
    - openrouter-deepseek-v4
    - nvidia-nim-deepseek
    - openrouter-deepseek-v4-flash
    - openrouter-qwen36plus
    default_paid: true
    description: "Task executor Gate 2 — cross-vendor quality review of deliverables. Renamed from 17_fresh_eyes_review 2026-05-10 (disambiguates from outreach pre-send check at 23_outreach_review)."
  # V4 placeholder: pre-reflection prompt engineering. Never wired. Reserved for
  # future adaptive-prompting work; remove if V4 design drops the feature.
  18_meta_prompting:
    chain:
    - openrouter-free
    default_paid: true
  20_adversarial_counterargument:
    chain:
    - openrouter-gpt55
    - nvidia-nim-deepseek
    - openrouter-deepseek-v4
    - openrouter-qwen36plus
    default_paid: true
    description: "Task executor Gate 3 — devil's advocate challenge of deliverables"
  21_session_observer:
    chain:
    - mistral-large-free
    - groq-free
    - gemini-free
    - openrouter-free
    retry_profile: background
  # V4 placeholder: entity extraction / metadata tagging for the knowledge graph.
  # No live consumers today; chain is prep for future memory-consolidation pipeline.
  22_tagging:
    chain:
    - mistral-small-free
    - groq-free
    - openrouter-free
  # Dream cycle: cluster-merge synthesis for episodic memory consolidation.
  # Free-tier only. Separate from 22_tagging (entity extraction).
  dream_cycle_synthesis:
    chain:
    - nvidia-nim-deepseek
    - openrouter-deepseek-v4-flash
    - groq-free
    retry_profile: background
  # Adversarial challenge of synthesis output. Must stay model-independent from
  # synthesis across the WHOLE chain, not just the primary: synthesis falls back
  # to groq-free, so a groq-led challenge could self-approve under a DeepSeek
  # outage. This challenge leads with mistral-large-free (disjoint from every
  # synthesis provider — deepseek-flash / groq) + paid Kimi as the deep fallback.
  # NIM's free Kimi was retired 2026-08 (404-for-account). Locked by
  # test_config_invariants::test_adversarial_challenge_sites_are_model_independent.
  dream_cycle_synthesis_challenge:
    chain:
    - mistral-large-free
    # Paid Kimi via OpenRouter as last-resort fallback — a non-DeepSeek, non-groq
    # family, so the challenge stays model-independent from synthesis across the
    # whole chain even when the free tier is down. Only billed during an outage.
    - kimi-k2.5
    retry_profile: background
  dream_cycle_entity_check:
    chain:
    - groq-free
    - mistral-small-free
    - openrouter-free
    # More free, NON-DeepSeek providers so the entity check stays independent
    # from the DeepSeek entity_challenge while surviving a free-tier outage.
    - gemini-free
    - mistral-large-free
    - openrouter-gemma4
    retry_profile: background
  # MW-2 relationship classifier — coarse relationship judgment
  # (duplicate/contradicts/succeeded_by/distinct) between candidate memory pairs.
  # Same free-SLM shape / task class as dream_cycle_entity_check; batched, on demand
  # (MW-2 measurement probe now; MW-5 merge-gate nominees later). §6.2 model tier is
  # the dial — start on the proven entity-check chain.
  dream_cycle_relationship_classify:
    chain:
    - groq-free
    - mistral-small-free
    - openrouter-free
    - gemini-free
    - mistral-large-free
    - openrouter-gemma4
    retry_profile: background
  # Adversarial challenge of entity "duplicate" verdicts. Flipped pairing:
  # DeepSeek challenges the entity_check's judgments (which lead with groq-free).
  dream_cycle_entity_challenge:
    chain:
    - nvidia-nim-deepseek
    - openrouter-deepseek-v4-flash
    retry_profile: background
  # Entity-NODE merge-vs-distinct adjudication (entity_adjudication drainer).
  # Same free-SLM shape as dream_cycle_entity_check; hourly, small backlog.
  entity_adjudication:
    chain:
    - groq-free
    - mistral-small-free
    - openrouter-free
    - gemini-free
    - mistral-large-free
    - openrouter-gemma4
    retry_profile: background
  # Adversarial challenge of an entity-node "merge" verdict. Flipped pairing
  # (DeepSeek challenges the groq-free-led adjudication) so a single model's
  # mistake cannot merge two distinct entities — both must agree before a merge.
  entity_adjudication_challenge:
    chain:
    - nvidia-nim-deepseek
    - openrouter-deepseek-v4-flash
    retry_profile: background
  # One-shot supervised wing backfill (scripts/wing_backfill.py) — batch
  # classification of legacy general/uncategorized memories into wings.
  # Same free background family as the dream-cycle classification sites.
  wing_backfill:
    chain:
    - nvidia-nim-deepseek
    - groq-free
    - openrouter-deepseek-v4-flash
    retry_profile: background
  27_pre_execution_assessment:
    chain:
    - glm51
    - openrouter-deepseek-v4-flash
    default_paid: true
    retry_profile: user_facing
    description: "Task executor — sanity-check proposed execution plans before committing resources"
  # Functionally replaced by awareness loop's signal collection
  # (awareness/loop.py:perform_tick). Kept as historical; no live consumers.
  28_observation_sweep:
    chain:
    - openrouter-deepseek-v4-flash
    - glm51
    - groq-free
    - gemini-free
    default_paid: true
    description: "Observation pipeline — batch classification and sweep (currently disabled)"
  29_retrospective_triage:
    chain:
    - groq-free
    - mistral-large-free
    - openrouter-nemo
  30_triage_calibration:
    chain:
    - lmstudio-30b
    - mistral-large-free
    default_paid: true
    retry_profile: background
  31_outcome_classification:
    chain:
    - glm51
    - mistral-large-free
    default_paid: true
    never_pays: false
  32_delta_assessment:
    chain:
    - glm51
    - mistral-large-free
    default_paid: true
    never_pays: false
  33_skill_refiner:
    chain:
    - gemini-free
    - groq-free
    - nvidia-nim-deepseek
    - mistral-large-free
    description: LLM-driven skill improvement proposals
  34_research_synthesis:
    chain:
    - gemini-free
    - groq-free
    - mistral-large-free
    - nvidia-nim-deepseek
    description: Synthesize research results into concise summaries
  38_procedure_extraction:
    chain:
    - nvidia-nim-deepseek
    - openrouter-deepseek-v4-flash
    - openrouter-deepseek-v4
    - groq-free
    - mistral-large-free
    default_paid: true
    description: Judge + store procedures from struggle detection and extraction
      pipeline candidates
  38a_procedure_novelty_llm:
    chain:
    - openrouter-deepseek-v4
    - glm51
    default_paid: true
    description: Cross-task_type procedure dedup judgment (is a new procedure
      redundant with existing ones). S-tier only — precision is the safety
      property (validated 0 false-merges on deepseek-v4); fires per novel
      procedure, low volume. glm51 is the second rung and is held to the same
      bar on TIER, not on evidence — glm-5.1 matches deepseek-v4-pro at S for
      both intelligence_tier and reasoning (config/model_profiles.yaml), but
      the 0-false-merge result was measured on deepseek-v4 alone. A chain of
      one meant a single provider outage took dedup judgment offline
      entirely; the ordering keeps the validated model first.
  41_reflection_json_salvage:
    chain:
    - mistral-large-free
    - gemini-free
    - openrouter-deepseek-v4
    default_paid: true
    description: Salvage a deep-reflection CC session that ended in prose (no
      fenced JSON) into the required structured JSON, so the cycle's cognitive
      output (cognitive_state_update, observations, memory_operations, surplus
      requests) isn't discarded. Quality matters — recovers otherwise-lost work.
  40_ego_focus_selection:
    chain:
    - groq-free
    - mistral-small-free
    - gemini-free
    description: "Unified cognitive loop focus selector — picks ego attention direction from pending signals"
  43_task_retrospective:
    chain:
    - nvidia-nim-deepseek
    - openrouter-deepseek-v4-flash
    - openrouter-deepseek-v4
    - mistral-large-free
    - gemini-free
    default_paid: true
    description: Post-execution retrospective learning extraction
  44_task_premortem:
    chain:
    - nvidia-nim-deepseek
    - openrouter-deepseek-v4-flash
    - openrouter-deepseek-v4
    - mistral-large-free
    - gemini-free
    default_paid: true
    description: Pre-mortem failure analysis before committing to execution
  45_intelligence_intake:
    chain:
    - gemini-free
    - groq-free
    - mistral-large-free
    - openrouter-free
    never_pays: true
    retry_profile: background
    description: "Intelligence intake — score uncurated recon findings for relevance and quality"
  # Reasoning-first (2026-07-12): generating operational gotchas from structured
  # infra facts is failure-mode reasoning over data, so it mirrors the `judge`
  # chain (deepseek reasoning) rather than a general-chat model — better matched
  # AND cheaper than sonnet. Regenerates only on a section's fact-hash change, so
  # cost is negligible. Free general models (gemini/mistral) proved high-quality
  # on the live first run and serve as robust fallback.
  46_infra_annotation:
    chain:
    - openrouter-deepseek-v4
    - nvidia-nim-deepseek
    - gemini-free
    - mistral-large-free
    - openrouter-free
    default_paid: true
    retry_profile: background
    description: "Infrastructure body-schema annotations — operational gotchas per fact section"
  35_content_draft:
    chain:
    - gemini-free
    - groq-free
    - mistral-large-free
    - openrouter-free
    description: Draft content for various platforms
  23_outreach_review:
    chain:
    - gemini-free
    - groq-free
    - mistral-large-free
    description: "Outreach pre-send cross-vendor review (free chain). Renamed from 23_fresh_eyes_review 2026-05-10 (disambiguates from executor Gate 2 at 17_executor_review)."
  36_code_auditor:
    chain:
    - kimi-k2.5
    - gemini-free
    - openrouter-mimo
    description: "Surplus code review \u2014 evaluate codebase for bugs and quality\
      \ issues"
  # Temporarily disabled in commit ff2198c (2026-05-03) \u2014 output quality from free
  # models was too low for the surplus pipeline. Sentinel infrastructure
  # (src/genesis/sentinel/monitor.py) remains in place. Rework pending: needs
  # higher-tier providers and tighter prompts before re-enable.
  37_infrastructure_monitor:
    chain:
    - groq-free
    - mistral-large-free
    - openrouter-nemo
    default_paid: true
    retry_profile: background
    description: "Proactive infrastructure monitoring \u2014 trend detection and forecasting"
  40_knowledge_distillation:
    chain:
