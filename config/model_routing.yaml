      next boundary); the detached worker spawns CC directly and reports via
      record_last_run_detached. Registered for neural-monitor visibility.
retry:
  # max_total_s: aggregate wall-clock ceiling (seconds) across a single
  # route_call's retries x chain length. A safety net against pathological
  # multi-minute hangs, checked only BETWEEN attempts (never interrupts an
  # in-flight call). It bounds ONE completion's retry-multiplier, NOT Genesis's
  # cognition (a reflection is many bounded completions). Omit for no cap.
  default:
    max_retries: 3
    base_delay_ms: 500
    max_delay_ms: 30000
    max_total_s: 300
  user_facing:
    max_retries: 2
    base_delay_ms: 300
    max_delay_ms: 5000
    max_total_s: 180
  background:
    max_retries: 4
    base_delay_ms: 1000
    max_delay_ms: 60000
    # Safety net for background dispatches (dream / reflection / ego / surplus).
    # MUST stay comfortably under the watchdog's 900s scheduler-heartbeat zombie
    # threshold (autonomy/watchdog.py _check_scheduler_heartbeats): a background
    # route_call that outlives it lets the surplus heartbeat go stale and the
    # watchdog restarts the WHOLE server — which, during the 2026-07 outage,
    # produced 25+ restart-kills in a day (was 1800s = 2x the threshold, so a
    # single stalled dispatch always tripped it). 600s still allows ~5 sequential
    # 120s hard-timeout attempts across the chain; it bounds ONE completion's
    # retry-multiplier, not cognition. Guarded by test_retry_profiles_under_watchdog_threshold.
    max_total_s: 600
