# Recon Watchlist — Projects Genesis actively monitors for updates.
#
# Base watch targets (committed). Install-specific entries (e.g., your own
# repo for star tracking) go in recon_watchlist.local.yaml (gitignored).
#
# Fields:
#   name:        Human-readable project name
#   repo:        GitHub owner/repo (primary source)
#   track:       What to watch — releases, commits, issues, discussions, stars
#   priority:    high | medium | low — affects check frequency and triage urgency
#   notes:       Why this project matters to Genesis / the user
#   urls:        Additional non-GitHub URLs to monitor (docs, blogs, changelogs)

projects:

  - name: Ripwire
    repo: redhat-et/ripwire
    track: [releases]
    priority: medium
    notes: Optional code intelligence CLI, MCP server, agent skills and hooks.

  - name: GitNexus
    repo: abhigyanpatwari/GitNexus
    track: [releases]
    priority: medium
    notes: Code graph indexing; qualify storage format and Node compatibility before updating.

  - name: Serena
    repo: oraios/serena
    track: [releases]
    priority: medium
    notes: Live symbol navigation and editing through the managed MCP launcher.

  - name: codebase-memory-mcp
    repo: DeusData/codebase-memory-mcp
    track: [releases]
    priority: medium
    notes: Code knowledge graph; monitoring does not enable a disabled local installation.

  - name: yt-dlp
    repo: yt-dlp/yt-dlp
    track: [releases]
    priority: medium
    notes: YouTube metadata and captions; qualify curl_cffi and the bundled JavaScript solver together.

  - name: curl_cffi
    repo: lexiforest/curl_cffi
    track: [releases]
    priority: medium
    notes: TLS impersonation for Scrapling and yt-dlp; includes native curl and compression libraries.

  - name: Scrapling
    repo: D4Vinci/Scrapling
    track: [releases]
    priority: medium
    notes: Async web fetching; qualify fetcher extras against the compatible browser stack.

  - name: Ruff
    repo: astral-sh/ruff
    track: [releases]
    priority: medium
    notes: Lint tooling; keep CI and the test extra on the same qualified version.

  - name: Brotli
    repo: google/brotli
    track: [releases]
    priority: medium
    notes: Python response decompression used by yt-dlp; separate from curl_cffi's bundled decoder.

  - name: Camoufox
    repo: daijro/camoufox
    track: [releases]
    priority: medium
    notes: Firefox engine and Python wrapper; qualify addon provisioning and Playwright compatibility.

  - name: Playwright Python
    repo: microsoft/playwright-python
    track: [releases]
    priority: medium
    notes: Browser driver; coordinate with Camoufox and Patchright before moving the minor version.

  - name: Patchright Python
    repo: Kaliiiiiiiiii-Vinyzu/patchright-python
    track: [releases]
    priority: medium
    notes: Chromium fallback; keep browser build and persistent profiles compatible with Playwright.

  - name: Claude Code
    repo: anthropics/claude-code
    track: [releases, commits, discussions]
    priority: high
    notes: >
      Primary intelligence layer (CC Max). New flags, features, and breaking
      changes directly affect Genesis CC integration (invoker, session_manager,
      conversation, checkpoint).
    urls:
      - https://docs.anthropic.com/en/docs/claude-code
      - https://code.claude.com/docs/en/overview

  - name: OpenClaw
    repo: openclaw/openclaw
    track: [releases, commits, issues]
    priority: medium
    notes: >
      Personal AI assistant — any OS, any platform. Competitive intelligence
      and potential pattern source for Genesis architecture.

  - name: Cognee
    repo: topoteretes/cognee
    track: [releases, commits]
    priority: medium
    notes: >
      Knowledge graph / memory infrastructure for AI agents. Relevant to
      Genesis memory-mcp and knowledge pipeline design.
    urls:
      - https://www.cognee.ai/

  - name: OpenFang
    repo: RightNow-AI/openfang
    track: [releases, commits, issues]
    priority: medium
    notes: >
      Open-source Agent Operating System. Agentic AI infrastructure —
      relevant to Genesis architecture and agent orchestration patterns.

  - name: claude-code-telegram (RichardAtCT)
    repo: RichardAtCT/claude-code-telegram
    track: [commits, releases, issues]
    priority: medium
    notes: >
      Telegram bridge for Claude Code. Reference implementation for DraftStreamer
      pattern and stop-button interrupt. Patterns directly adaptable to Genesis
      subprocess model (CCInvoker.interrupt via SIGINT). 2,185 stars.

  - name: NVIDIA NeMo
    repo: NVIDIA/NeMo
    track: [releases]
    priority: medium
    notes: >
      NVIDIA's end-to-end platform for LLM training, fine-tuning, and
      inference. Relevant to model routing strategy and local compute options.
    urls:
      - https://docs.nvidia.com/nemo-framework/
      - https://github.com/NVIDIA/NeMo/releases

  - name: Rustwright
    repo: Skyvern-AI/rustwright
    track: [releases, commits]
    priority: low
    notes: >
      Rust in-process, Playwright-API-COMPATIBLE driver — a genuine drop-in for
      the Playwright layer Genesis already runs (mcp/health/browser.py). Claims
      ~2.5x faster, ~70% less RAM, and no Node.js driver subprocess — which
      directly attacks our real Playwright process-sprawl pain (a single session
      spawns 7-9 child procs; see autonomy/remediation.py) plus sheds Playwright
      driver fingerprints. Chromium-only (never touches Firefox). Stealth
      hypothesis worth testing: run ON-BOX in-process (NOT over CDP — a remote
      debug port is itself a detection surface), a real local Chrome with no
      Node-driver signature and no CDP-attach tells could beat Camoufox on the
      automation-detection axis (real Chrome fingerprint blends better than
      minority Firefox); engine-level fingerprint spoofing (canvas/WebGL) is a
      separate axis it doesn't cover. Alpha. Pilot once it stabilizes: benchmark
      RAM/speed/proc-count AND on-box stealth vs Camoufox. Watch for beta.
