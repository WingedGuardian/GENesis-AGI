# Sentinel configuration
#
# autonomy.mode — reversibility-autonomy rollout state:
#   shadow (default): every proposed action still requires human approval;
#     the Sentinel additionally LOGS a per-action would-decision
#     (would_auto_run / would_gate) to sentinel_log.jsonl so the
#     auto-eligibility allowlist can be calibrated against real incidents.
#   live: RESERVED — not implemented yet. When it ships, auto-eligible
#     (reversible + safe + allowlisted) actions will execute without
#     approval and notify the owner. Flipping an install to live is a
#     per-install decision: set it in config/sentinel.local.yaml (gitignored
#     overlay), never in this tracked file.
autonomy:
  mode: shadow

# codex_mcp_stop.mode: the Sentinel's stop tool for MCP servers held by a
# shared Codex app-server daemon (python -m genesis.sentinel.codex_mcp_stop).
#   propose_only (default): the tool may be proposed and, once the owner
#     approves the action, run with --execute. Genesis never schedules it on
#     its own; the Sentinel prompt forbids the session running --execute
#     itself (a prompt rule, not an enforcement: that session has Bash).
#   off: the tool refuses before scanning, in dry-run and --execute alike
#     (exit 4), so a session that only runs the dry-run sees it is off.
# Any other value reads as off. GENESIS_CODEX_MCP_STOP_DISABLED=1 also turns
# it off. Set per install in config/sentinel.local.yaml.
codex_mcp_stop:
  mode: propose_only
