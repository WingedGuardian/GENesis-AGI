# Genesis v3 Autonomy Configuration

# WS-8 PR-D — owner notification on each autonomous (GRANTED-cell) email send.
# Muted by default; the dashboard "Activity" tab is the primary visibility path.
# Set true to also receive a per-send Telegram notice. Needs a server restart.
email_send_notify: false

# Default autonomy levels per category (user can override via natural language)
defaults:
  direct_session: 1      # L1 — conservative start
  background_cognitive: 1
  sub_agent: 1
  outreach: 1

# Context ceilings — hard caps regardless of earned level
ceilings:
  direct_session: 7      # Effectively uncapped
  background_cognitive: 3 # L3 max
  sub_agent: 2           # L2 for irreversible actions
  outreach: 2            # L2 until engagement data proves calibration

# V3 approval policy: action class → gate decision
# In V3, costly_reversible and irreversible ALWAYS require user approval.
# User can grant per-task exemptions for costly_reversible via NL.
approval_policy:
  reversible: "act"            # Proceed without approval
  costly_reversible: "propose" # Ask user first (always in V3)
  irreversible: "propose"      # Ask user first (always, no exceptions in V3)

# Approval timeout (seconds) per action type
# All human-action approvals wait forever (no timeout).
# Timeouts on human-action approvals are effectively auto-rejections.
approval_timeouts:
  outreach: null
  task_proposal: null
  irreversible: null     # Wait forever

# Earn-back evidence window (days). Eligibility to propose restoring a
# demoted autonomy level is computed from the Bayesian posterior over
# autonomy_events within this window — recent behavior, not lifetime
# history. Promotion always requires explicit user approval.
earnback:
  window_days: 45

# Regression policy
regression:
  consecutive_corrections_threshold: 2  # Drop one level after this many
  announce_regression: true             # Notify user when regression fires

# Watchdog configuration
watchdog:
  status_file: "~/.genesis/status.json"  # Reuse existing StatusFileWriter output
  staleness_threshold_seconds: 900       # 15 minutes — 3x awareness cadence (300s) headroom for slow ticks (Light reflection, etc.)
  check_interval_seconds: 60             # How often watchdog checks
  max_restart_attempts: 5                # Stop trying after this many consecutive failures
  backoff_initial_seconds: 10
  backoff_max_seconds: 300               # Cap at 5 minutes
  config_validation: true                # Validate config before restart
  # Flap damping — a SLOW recurring same-reason restart (spaced beyond the 120s
  # stabilization window, so consecutive_failures resets each time) would restart
  # forever; restart cannot fix a persistent external cause (2026-07 outage flapped
  # zombie_scheduler ~25x/12h). Once >= flap_threshold same-reason restarts land
  # within flap_window_seconds, escalate backoff (capped) and surface one warning
  # alert. A BACKOFF, not a refusal — self-heals once the window prunes.
  flap_window_seconds: 21600             # 6h rolling per-reason window
  flap_threshold: 3                      # same-reason restarts before damping kicks in
  flap_backoff_max_seconds: 7200         # cap escalating flap backoff at 2h
  # Down-vs-starved distinguisher: before restarting genesis-server for a
  # staleness/zombie reason, the watchdog queries the off-loop liveness probe
  # (a SYNC Flask route that answers even when the event loop is starved). A
  # fresh, high-lag reading = UP-but-starved, not dead — a restart there just
  # re-triggers the boot backlog that caused the starvation. Suppress + alert,
  # bounded by max_starved_skips so a genuinely-stuck loop still recovers. Port
  # matches the shipped server default (5000); change both together if relocated.
  liveness_url: "http://127.0.0.1:5000/api/genesis/liveness"
  liveness_lag_suppress_ms: 1000         # suppress restart only above this loop lag (well over the 250ms warn floor)
  liveness_sample_stale_s: 120           # sample older than this = loop fully wedged → restart, don't suppress
  liveness_max_starved_skips: 6          # max consecutive suppressed restarts (~30 min at 300s cadence) before restarting anyway

# CC rate limit detection patterns
# These are parsed from CC CLI stderr/stdout when rate limits are hit.
# Update when CC CLI changes behavior.
rate_limit_patterns:
  exit_codes: []          # To be populated after empirical testing
  stderr_patterns:
    - "rate limit"
    - "usage limit"
    - "Rate limit"
    - "try again"
    - "quota exceeded"

# STEERING.md configuration
steering:
  max_rules: 20           # FIFO eviction at this count
  file_path: "src/genesis/identity/STEERING.md"

# Calibration feedback injection
calibration:
  min_sample_count: 10    # Minimum predictions per domain before injecting feedback
  injection_depths:       # Only inject at these reflection depths
    - "deep"
    - "strategic"

# Task model/effort defaults (user override always wins)
task_models:
  deep_reflection:
    model: "sonnet"
    effort: "high"
  strategic_reflection:
    model: "opus"
    effort: "high"
  surplus_brainstorm:
    model: "sonnet"
    effort: "medium"
  inbox_evaluation:
    model: "sonnet"
    effort: "medium"
  research:
    model: "sonnet"
    effort: "high"
  code_modification:
    model: "opus"
    effort: "high"
