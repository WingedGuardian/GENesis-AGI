# Codex is an external client: Genesis retains its health/recall floor, while
# GitNexus provides the separately approved code-intelligence tools below.
# The Genesis launcher strips inherited Genesis/Claude session identity.

# Local CLI shell guard only. No Genesis session registration or approval receipt.
# The outer fallback denies if the repository or the launcher cannot be found.
# It must NOT fire on the launcher's own deny (exit 2): that one has already
# explained itself, and an "unavailable" line under it reads as a broken guard.
# Exit 2 counts as explained only with the launcher's "deny" on fd 3 (bash
# also exits 2 on a launcher syntax error). Anything else is a guard failure:
# deny, and say so. `|| rc=$?` keeps an errexit shell (a profile's `set -e`;
# Codex runs hooks as `$SHELL -lc`) from exiting with the launcher's code,
# which Codex would read as permit; `|| top=""` does the same for the repository
# lookup, which would otherwise exit 128 outside a checkout. The launcher's stdout is discarded: it
# never needs it, and hook stdout must stay empty.
[[hooks.PreToolUse]]
matcher = "^Bash$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'top=$(git rev-parse --show-toplevel 2>/dev/null) || top=""; guard="$top/scripts/hooks/codex-review-stop"; [ -n "$top" ] && [ -f "$guard" ] || { printf "%s\n" "BLOCKED: review guard unavailable; stop and handoff to the user." >&2; exit 2; }; rc=0; out=$(bash "$guard" 3>&1 1>/dev/null) || rc=$?; [ "$rc" -eq 0 ] && exit 0; [ "$rc" -eq 2 ] && [ "$out" = "deny" ] && exit 2; printf "%s\n" "BLOCKED: review guard failed (exit $rc); stop and handoff to the user." >&2; exit 2'

# Genesis MCP servers for Codex. Owner ruling (2026-11-08): an owner-operated
# Codex session gets the same Genesis tools a Claude Code session gets. The
# launcher (scripts/codex_owner_mcp.py) starts the ordinary server, labelled
# `codex` so calls are recorded in client_tool_calls. A Codex run Genesis starts
# unattended (genesis.util.codex_cli sets GENESIS_CC_SESSION=1) keeps the
# external 13-tool health/memory floor and gets no outreach or recon server;
# `env_vars` forwards that marker, since Codex passes an MCP child nothing else.
#
# Approvals (owner ruling 2026-11-08): reads run without a prompt; anything that
# writes, sends, spends or spawns asks first. The server default is `prompt` and
# only the read tools listed below are pre-approved, so a NEW tool asks until it
# is classified here. tests/test_scripts/test_codex_owner_mcp.py checks every
# listed name is a registered tool. "Spends" means a spend the CALLER can
# request: recall's internal corrective grading is not one, so recall tools are
# pre-approved, while web_search/web_fetch (a paid backend is one argument
# away; approval is per tool, not per argument) and resume_review (paid model
# calls on any local file) prompt. health_errors/health_alerts are blind to
# dead letters and breakers in the standalone server, for Claude Code too (#3152).
#
# The prompt tier holds only under an approval policy that can ask. Measured on
# codex-cli 0.166.0: under --dangerously-bypass-approvals-and-sandbox a prompt
# tool runs without asking, and under approval_policy="never" it is refused.

[mcp_servers.genesis-health]
command = "python3"
args = ["scripts/codex_owner_mcp.py", "--server", "health"]
cwd = "."
startup_timeout_sec = 30
env_vars = ["GENESIS_CC_SESSION", "GENESIS_SESSION_ORIGIN"]
default_tools_approval_mode = "prompt"
tools.bench_status.approval_mode = "approve"
tools.board_item.approval_mode = "approve"
tools.board_status.approval_mode = "approve"
tools.bootstrap_manifest.approval_mode = "approve"
