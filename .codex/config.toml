# Shared pinned launcher; no install-specific paths or npm downloads at startup.
# GitNexus is snapshot-based. Availability does not imply a fresh index or
# authorization to rename code or rebuild shared repository/group metadata.
[mcp_servers.gitnexus]
command = "bash"
args = [".claude/mcp/run-gitnexus", "mcp"]
cwd = "."
startup_timeout_sec = 30
enabled_tools = [
  "api_impact",
  "check",
  "context",
  "cypher",
  "detect_changes",
  "explain",
  "group_list",
  "impact",
  "list_repos",
  "pdg_query",
  "query",
  "route_map",
  "shape_check",
  "tool_map",
  "trace",
]
default_tools_approval_mode = "approve"
