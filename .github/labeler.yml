# Path-glob → label, applied by .github/workflows/labeler.yml on PR open/sync.
#
# WHY LABELS AT ALL. The gate-fix lane (genesis-development skill) applies to a
# pull request whose diff touches the enforcement-hook surface, and today every
# session derives that membership by hand — reading the diff, remembering the
# constants, judging. A label makes the same fact visible on the pull request
# itself, to a reader who has not read the skill, before anyone opens a file.
#
# THESE LABELS DECIDE NOTHING. Nothing gates on them: not the merge gate, not
# CI, not a ruleset. They are an annotation. The authority for lane membership
# remains `_is_hook_surface_path` in scripts/hooks/git_push_guard.py, which the
# gate actually calls — and if this file and that function ever disagree, the
# function is right and this file is a stale mirror. Never reason from the
# label; reason from the gate's own report (`--check-pr`) and treat the label
# as the thing that made you look.
#
# The globs mirror `_HOOK_SURFACE_PREFIXES` / `_HOOK_SURFACE_FILES`: three
# directory prefixes, then the 27 named files enumerated one by one, because
# that is what the constant is. An earlier version of this comment said the
# mirror was written "in prefix form" so it would keep matching when a new hook
# lands — true of the three directories, false of the 27 files, and the claim
# mattered because it describes a safety property the file does not have. What
# actually catches a 28th hook is the test, which reads the constant from the
# guard's AST and fails when this list falls behind it.

gate-surface:
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/hooks/**'
          - '.claude/hooks/**'
          - 'config/behavioral_rules/**'
          - '.claude/settings.json'
          - 'config/protected_paths.yaml'
          - 'config/repo_topology.yaml'
          - 'scripts/bash_safety_hook.sh'
          - 'scripts/behavioral_linter.py'
          - 'scripts/check_stale_pending.py'
          - 'scripts/content_safety_hook.py'
          - 'scripts/contribution_offer_hook.py'
          - 'scripts/edit_failure_sensor.py'
          - 'scripts/file_context_hook.py'
          - 'scripts/file_modification_audit_hook.py'
          - 'scripts/genesis_precompact.py'
          - 'scripts/genesis_session_context.py'
          - 'scripts/genesis_session_end.py'
          - 'scripts/genesis_stop_hook.py'
          - 'scripts/genesis_urgent_alerts.py'
          - 'scripts/plan_bookmark_hook.py'
          - 'scripts/pretool_check.py'
          - 'scripts/proactive_memory_hook.py'
          - 'scripts/procedure_advisor.py'
          - 'scripts/review_enforcement_commit.py'
          - 'scripts/review_enforcement_prompt.py'
          - 'scripts/review_invalidate_on_commit.py'
          - 'scripts/review_scope.py'
          - 'scripts/review_state.py'
          - 'scripts/surface_open_prs.py'
          - 'scripts/surface_pr_updates.py'

# CI and repository configuration: not hook surface, but a change here can
# disable a required check as effectively as editing a gate.
ci-config:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

# Documentation-only, in the sense the merge gate's `_is_doc_path` uses: this
# is the shape whose post-merge verification row is auto-closed deterministically
# (issue #1718). The label is informational — the exemption is computed from the
# diff at merge time, never read from here.
documentation:
  - changed-files:
      # ONE clause with a nested-brace union, because `all-globs-to-all-files`
      # means "every glob matches EVERY changed file" — so two such clauses
      # OR'd is NOT the union. A PR touching both `docs/x.md` and `LICENSE`
      # satisfied NEITHER and went unlabelled, which is the third wrong version
      # of this rule (audit, PR #1907). The comment then under-stated the miss
      # it had just introduced, naming only case-insensitive stems.
      #
      # Mirrors `_is_doc_path` (git_push_guard.py): any prose extension at any
      # depth, plus a known documentation STEM with `.txt` or no extension.
      # NOT verified by running this glob. An earlier version of this comment
      # claimed a test matched it against the classifier over `git ls-files`; no
      # such test exists, and saying it did is how the next reader stops looking.
      # What the test DOES check is the clause count and the extension/stem
      # vocabulary, read from the classifier rather than restated — enough to
      # catch the two mistakes actually made here, and blind to a narrowed path
      # scope (measured: it survives dropping `**/`, and survives narrowing to
      # `docs/**`, which is the exact shape of the original bug).
      #
      # Case is a second, latent divergence: the classifier lowercases, this
      # glob is matched without `nocase`, so `license.txt` or `Changelog.txt`
      # would classify as docs and not be labelled. MEASURED 0 such files in
      # 3,924 tracked — latent, and the kind of gap a corpus cannot show you.
      - all-globs-to-all-files:
          - '**/{*.{md,markdown,rst,adoc,MD,RST,ADOC},{CHANGELOG,README,LICENSE,NOTICE,COPYING,AUTHORS,CONTRIBUTING}{,.txt}}'
