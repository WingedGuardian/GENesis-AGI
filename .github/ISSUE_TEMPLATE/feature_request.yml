name: Feature Request
description: Suggest a feature or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Why do you want it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Include examples if possible.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Memory
        - Dashboard
        - Runtime
        - Guardian
        - Autonomy
        - Channels (Telegram, Gmail, etc.)
        - Install / Setup
        - Other
  - type: textarea
    id: premises
    attributes:
      label: Premise checks
      description: |
        1. Is every claim about outside behaviour (GitHub, git, a provider API) measured or cited, not asserted?
        2. Was the repo searched for existing code that already does this, with the result written down?
        3. Do the scope limits block the obvious shared code?
        4. Is the caller named and tracked (an issue), or is there a stated reason there is none?
        5. Does every number say how it was measured (what was counted, by which script)?
        6. Is the PR shape stated: expected size in counted lines (scripts/pr_shape.py), and a split or a `Shape:` reason at 500 or more?
    validations:
      required: false
