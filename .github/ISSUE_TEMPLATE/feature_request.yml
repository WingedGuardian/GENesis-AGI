name: Feature Request
description: Suggest a feature or improvement
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Why do you want it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Include examples if possible.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Memory
        - Dashboard
        - Runtime
        - Guardian
        - Autonomy
        - Channels (Telegram, Gmail, etc.)
        - Install / Setup
        - Other
  - type: textarea
    id: premises
    attributes:
      label: Premise checks
      description: |
        Write each answer after its label. Items 1 to 5 state the problem and are owed by every issue; 6 to 9 describe the change (if you write any of them, write all four). `n/a — <reason>` is an answer; a bare `n/a` is not.
        1. Observed: what happens, with the command, output and commit (a fresh main), and the local causes ruled out.
        2. Intended: what should happen. Stated: the doc, test, ruling or comment that says so, or "nowhere".
        3. Cost: who or what is affected, how often, and how that was measured.
        4. Searched: existing issues, main and prior rulings: what was searched, and what was found.
        5. Acceptance: what must hold afterwards. Wrong fix: the tempting fix that must fail, or "none, because ...".
        6. Mechanism: why this removes the cause; who calls it and what they do differently.
        7. Alternatives: what already does or decides this, the simpler mechanism considered, and why not each.
        8. Evidence: every outside-behaviour claim and number, measured or cited.
        9. Shape: counted lines (python3 scripts/pr_shape.py --base origin/main), and the split or the `Shape:` reason.
      value: |
        1. Observed:
        2. Intended:
           Stated:
        3. Cost:
        4. Searched:
        5. Acceptance:
           Wrong fix:
        6. Mechanism:
        7. Alternatives:
        8. Evidence:
        9. Shape:
    validations:
      required: false
