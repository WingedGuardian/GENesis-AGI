name: Bug Report
description: Report a bug in Genesis
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, install method, etc.
      placeholder: |
        - OS: Ubuntu 24.04 (Incus container)
        - Python: 3.12
        - Genesis version: v3.0a2
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: |
        Help us confirm the bug is in Genesis and not in the setup around it. A short line each is enough.
        1. Reproduced: how, and on which version or commit?
        2. Evidence: the exact command or action, and what it printed.
        3. Ruled out on your side: a typo or misuse, local configuration, an out-of-date install, expired credentials.
        4. Searched: no existing issue for this, and no newer version that already fixes it.
        5. Expected vs actual.
      placeholder: |
        1. ...
        2. ...
        3. ...
        4. ...
        5. ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error messages or log output
      render: shell
