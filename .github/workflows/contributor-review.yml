name: Contributor review trigger

# Ask the automated reviewer to look at an OUTSIDE contributor's PR — but only
# when that PR answers an issue we both LABELLED as invited and ASSIGNED to that
# contributor. Two maintainer actions, and the assignment is the one that
# authorises: it needs triage permission, so no fork author can grant it to
# themselves. The closing link is author-controlled and authorises nothing on
# its own.
#
# WHY THIS EXISTS. The reviewer runs automatically for the maintainer's own PRs
# and does not for forks, which is the right default: an outside PR should not be
# able to spend the reviewer's quota by existing. But a contributor who picked up
# a labelled issue is not a drive-by, and making them wait for a human to type
# "@codex review" is friction we chose, not friction we want.
#
# ── SECURITY: why this is `pull_request_target`, and what that obliges ───────
# A `pull_request` run for a fork gets a READ-ONLY token, so it cannot comment.
# `pull_request_target` gets a writable token — but it runs in the BASE repo's
# context with that token available, so if it ever executed head-ref code, an
# outside contributor would be running arbitrary code with repository write
# access. That is the single well-known footgun of this trigger.
#
# The mitigation here is structural rather than careful: this workflow NEVER
# obtains the head code. There is no `actions/checkout`, no build, no install, no
# test, and no `run:` step that consumes PR-authored content. It reads metadata
# through the API and posts one comment. Nothing an author writes is executed,
# and the one author-influenced input — WHICH issue is linked — decides nothing
# on its own: the issue must be in this repository, must carry a label only a
# maintainer can set, and must be ASSIGNED BY A MAINTAINER to this PR's author.
# No author-supplied string is interpolated into a shell, a template, or a query.
#
# The one-review-per-issue budget further down is a courtesy bound, not part of
# this boundary: it reads author-mutable state and must never be relied on as a
# control. Assignment is what holds.
#
# Keep it that way. If this workflow ever needs to inspect the diff, that work
# belongs in a separate `pull_request` job with the default read-only token.

on:
  pull_request_target:
    # `opened` covers the normal case; `ready_for_review` covers a PR that was
    # opened as a draft, since the reviewer treats leaving draft as the start.
    #
    # `edited` is here because the closing link usually arrives LATE. A
    # contributor opens the PR and then adds "Closes #N" to the body — under
    # opened/ready_for_review alone that PR silently never qualifies, which is
    # the common path, not the edge case. Same for a draft marked ready before
    # its link is added.
    #
    # It is safe to widen here only because nothing downstream trusts the body:
    # the job reads the CLOSING GRAPH, and eligibility rests on maintainer state
    # (an invited label plus an assignment the author cannot grant themselves).
    # Re-running on every edit therefore cannot manufacture eligibility — it can
    # only notice that the maintainer's own state now matches.
    types: [opened, ready_for_review, edited]

# Least privilege. `pull-requests: write` is the ONLY elevated scope, and it
# exists solely to post the trigger comment.
permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  # One trigger per PR. A draft opened and then marked ready fires twice, and
  # with `edited` an author can fire it many more times.
  group: contributor-review-${{ github.event.pull_request.number }}
  # Supersede rather than queue. Every run recomputes eligibility from current
  # state, so an in-flight run is never worth more than the one behind it, and
  # queueing a burst of body edits would just serialise identical work. The run
  # that survives sees the latest state; the budget check still prevents a
  # second request if an earlier run already posted.
  cancel-in-progress: true

jobs:
  request-review:
    runs-on: ubuntu-latest
    # A cheap pre-filter ONLY. It is not the eligibility rule and must not be
    # read as one: the script applies the real predicate to this PR as well, via
    # exactly the same function it applies to every other PR. Duplicating a
    # condition here that the script does not also enforce is how the two drift.
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.draft == false
    steps:
      - name: Trigger a review when the PR answers a labelled issue
        uses: actions/github-script@v7
        with:
          script: |
            // ─────────────────────────────────────────────────────────────
            // ONE DEFINITION OF "ELIGIBLE", APPLIED TO EVERY PR — THIS ONE TOO.
            //
            // Read this before changing anything below, because the shape of
            // the bug this replaces is not obvious from any single line.
            //
            // Eight review findings landed on this workflow, and re-read as a
            // matrix they are all ONE defect. The rows are the objects the
            // workflow reasons about (the issue, THIS pull request, the SIBLING
            // pull requests that close the same issue); the columns are the
            // properties that decide whether a review may be spent. Every round
            // found a different EMPTY CELL:
            //
            //     issue    open?            -> missed
            //     issue    assigned?        -> missed (the original P1)
            //     THIS pr  open?            -> missed
            //     sibling  draft/closed?    -> missed
            //     sibling  author assigned? -> missed
            //     sibling  from a fork?     -> still empty, and nobody had
            //                                  raised it yet
            //
            // Patching cells one at a time is what produced four rounds. The
            // cause was never a missing check — it was that "eligible" had no
            // single definition, so each object got its own ad-hoc subset and
            // the asymmetries were invisible.
            //
            // So: `isEligible` below is the ONLY place eligibility is decided,
            // and it is applied to this PR and to every sibling identically. A
            // new property is added in one place and every object gets it. The
            // job-level `if:` above is a cheap pre-filter, not a second rule —
            // this PR is put through the same predicate regardless.
            // ─────────────────────────────────────────────────────────────

            // Labels that mark an issue as one we invited work on.
            const INVITED = ['good first issue', 'first-timers-only'];

            // Bounds. An author controls how many links their body carries and
            // how many PRs point at an issue, so both walks are capped and both
            // FAIL CLOSED: past the cap we cannot prove the budget is unspent,
            // and not knowing resolves to declining. Failing closed costs a
            // human one comment; failing open costs the quota this exists for.
            const MAX_LINKED_PRS = 30;
            const MAX_LINKED_ISSUES = 20;

            const pr = context.payload.pull_request;

            /**
             * THE predicate. `candidate` is a plain shape so this one function
             * serves both the webhook payload for THIS pr and a GraphQL node
             * for a sibling — the point is that neither gets its own rules.
             *
             * `issue` is the REST issue object: labels, state and assignees all
             * arrive inline, so nothing here can be truncated by a nested
             * connection.
             */
            function isEligible(candidate, issue, why) {
              const author = (candidate.author || '').toLowerCase();
              const checks = {
                'pr is open':        candidate.state === 'OPEN',
                'pr is not a draft': candidate.isDraft === false,
                'pr is from a fork': candidate.isCrossRepository === true,
                'issue is open':     issue.state === 'open',
                'issue is invited':  (issue.labels || []).some(l =>
                  INVITED.includes(((typeof l === 'string' ? l : l.name) || '').toLowerCase())),
                'issue is assigned to the pr author': (issue.assignees || []).some(
                  a => ((a && a.login) || '').toLowerCase() === author && author !== ''),
              };
              const failed = Object.keys(checks).filter(k => !checks[k]);
              if (failed.length && why) {
                core.info(`  ${why}: not eligible — ${failed.join('; ')}`);
              }
              return failed.length === 0;
            }

            // Normalise THIS pr into the same shape a sibling arrives in, so it
            // is genuinely the same object to the predicate rather than a
            // lookalike. `state` is upper-cased to match GraphQL's enum.
            const self = {
              number: pr.number,
              author: (pr.user && pr.user.login) || '',
              state: String(pr.state || '').toUpperCase(),
              isDraft: pr.draft === true,
              isCrossRepository:
                (pr.head && pr.head.repo && pr.head.repo.full_name) !==
                `${context.repo.owner}/${context.repo.repo}`,
            };

            // ── Which issues does this PR close? ──────────────────────────
            // A formal closing link, not a mention: `closingIssuesReferences` is
            // populated only by "Closes #N"-style keywords. It authorises
            // nothing on its own — it only selects which issue to evaluate.
            const linkQ = `
              query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first: 50, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { number repository { nameWithOwner } }
                    }
                  }
                }
              }`;

            const linked = [];
            let cursor = null;
            for (;;) {
              const d = await github.graphql(linkQ, {
                owner: context.repo.owner, repo: context.repo.repo,
                number: pr.number, cursor,
              });
              const conn = d.repository.pullRequest.closingIssuesReferences;
              linked.push(...(conn.nodes || []));
              if (linked.length > MAX_LINKED_ISSUES) {
                core.info(
                  `PR #${pr.number} closes more than ${MAX_LINKED_ISSUES} issues — ` +
                  `declining rather than fanning out on request.`
                );
                return;
              }
              if (!conn.pageInfo.hasNextPage) break;
              cursor = conn.pageInfo.endCursor;
            }

            // Only issues in THIS repository decide. A reference into a repo the
            // author controls would let them supply their own labels.
            const ours = linked.filter(i =>
              i.repository &&
              i.repository.nameWithOwner === `${context.repo.owner}/${context.repo.repo}`
            );
            if (!ours.length) {
              core.info(`PR #${pr.number} closes no issue in this repository — no review requested.`);
              return;
            }

            // ── Every PR that closes a given issue, with the fields the
            // predicate needs. Same fields for siblings as for self.
            const siblingQ = `
              query($owner:String!, $repo:String!, $issue:Int!, $cursor:String) {
                repository(owner:$owner, name:$repo) {
                  issue(number:$issue) {
                    closedByPullRequestsReferences(first: 30, after: $cursor, includeClosedPrs: true) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        number
                        state
                        isDraft
                        isCrossRepository
                        author { login }
                        comments(first: 100) {
                          pageInfo { hasNextPage }
                          nodes { body }
                        }
                      }
                    }
                  }
                }
              }`;

            /**
             * Decide for ONE invited issue. Returns true only if this PR is
             * eligible for it, no eligible PR has already spent its review, and
             * this PR is the lowest-numbered eligible contender.
             */
            async function mayClaim(issueNumber) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
              });

              // THIS pr goes through the predicate first, and through the SAME
              // function every sibling will. A closed PR reaching the job via
              // an `edited` event is rejected here, by the same line that
              // rejects a closed sibling.
              if (!isEligible(self, issue, `PR #${pr.number} vs issue #${issueNumber}`)) {
                return false;
              }

              // The budget: one automatic review per invited issue.
              //
              // Stated plainly so it is never mistaken for a control: this is
              // derived from `closedByPullRequestsReferences`, which is
              // author-MUTABLE — unlink "Closes #N" and a PR leaves the graph.
              // It is a COURTESY BOUND that stops an already-eligible
              // contributor spending several reviews on one issue. The security
              // property is `isEligible`, and specifically the assignment,
              // which no author can grant themselves.
              let lowest = self.number;
              let seen = 0;
              let cur = null;
              for (;;) {
                const d = await github.graphql(siblingQ, {
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue: issueNumber, cursor: cur,
                });
                const conn = d.repository.issue.closedByPullRequestsReferences;
                for (const node of conn.nodes || []) {
                  seen += 1;
                  if (seen > MAX_LINKED_PRS) {
                    core.info(
                      `Issue #${issueNumber} has more than ${MAX_LINKED_PRS} linked PRs — ` +
                      `cannot prove its review budget is unspent; declining.`
                    );
                    return false;
                  }
                  // SELF APPEARS IN THIS WALK TOO, and is treated the same.
                  // An earlier draft skipped it outright as "already judged" —
                  // which silently skipped its COMMENT check as well, so a PR
                  // that had already been sent to the reviewer would be sent
                  // again on its next `edited` or `ready_for_review` event.
                  // That is the very "self is special" asymmetry this rewrite
                  // exists to remove, reintroduced in one line. Eligibility is
                  // not re-judged for self only because it was judged above by
                  // the same function; everything else applies uniformly.
                  const candidate = {
                    number: node.number,
                    author: (node.author && node.author.login) || '',
                    state: node.state,
                    isDraft: node.isDraft,
                    isCrossRepository: node.isCrossRepository,
                  };
                  const isSelf = node.number === self.number;
                  // An INELIGIBLE PR can neither spend the review nor hold the
                  // budget. Skipping it here is what stops an ineligible PR
                  // suppressing an eligible one forever.
                  if (!isSelf && !isEligible(candidate, issue)) continue;

                  if (node.comments.pageInfo.hasNextPage) {
                    core.info(
                      `PR #${node.number} (closing #${issueNumber}) has more comments than ` +
                      `one page — cannot prove no review was requested; declining.`
                    );
                    return false;
                  }
                  if ((node.comments.nodes || []).some(
                        c => c.body && c.body.includes('@codex review'))) {
                    core.info(
                      `Issue #${issueNumber} already spent its automatic review on ` +
                      `PR #${node.number}${isSelf ? ' (this PR)' : ''} — not requesting another.`
                    );
                    return false;
                  }
                  if (node.number < lowest) lowest = node.number;
                }
                if (!conn.pageInfo.hasNextPage) break;
                cur = conn.pageInfo.endCursor;
              }

              // Deterministic winner when several ELIGIBLE PRs race: the lowest
              // number. Every racer computes the same answer from the same data,
              // so at most one concludes it has won and no lock is needed. It
              // holds because PR numbers are monotonic — a PR created later
              // always sees the earlier ones.
              if (lowest !== self.number) {
                core.info(
                  `Issue #${issueNumber}'s review belongs to PR #${lowest}, an eligible ` +
                  `contribution opened before PR #${pr.number} — declining.`
                );
                return false;
              }
              return true;
            }

            let claimed = null;
            for (const ref of ours) {
              if (await mayClaim(ref.number)) { claimed = ref.number; break; }
            }

            if (claimed === null) {
              core.info(
                `PR #${pr.number}: no invited issue it closes is claimable — ` +
                `no review requested. Linked issues in this repo: ` +
                ours.map(i => `#${i.number}`).join(', ')
              );
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '@codex review',
            });
            core.info(
              `Requested a review on PR #${pr.number} — it closes invited issue ` +
              `#${claimed}, which is assigned to @${self.author} and whose automatic ` +
              `review had not been spent.`
            );
