name: Contributor review trigger

# Ask the automated reviewer to look at an OUTSIDE contributor's PR — but only
# when that PR answers an issue we both LABELLED as invited and ASSIGNED to that
# contributor. Two maintainer actions, and the assignment is the one that
# authorises: it needs triage permission, so no fork author can grant it to
# themselves. The closing link is author-controlled and authorises nothing on
# its own.
#
# WHY THIS EXISTS. The reviewer runs automatically for the maintainer's own PRs
# and does not for forks, which is the right default: an outside PR should not be
# able to spend the reviewer's quota by existing. But a contributor who picked up
# a labelled issue is not a drive-by, and making them wait for a human to type
# "@codex review" is friction we chose, not friction we want.
#
# ── SECURITY: why this is `pull_request_target`, and what that obliges ───────
# A `pull_request` run for a fork gets a READ-ONLY token, so it cannot comment.
# `pull_request_target` gets a writable token AND access to repository secrets —
# but it runs in the BASE repo's context, so if it ever executed head-ref code an
# outside contributor would be running arbitrary code with repository write
# access and could read those secrets. That is the well-known footgun.
#
# THIS WORKFLOW CARRIES A PRIVILEGED CREDENTIAL. The review request is posted
# under a MAINTAINER identity via `secrets.REVIEW_REQUEST_TOKEN`, because the
# reviewer resolves the requester from the comment AUTHOR and rejects
# `github-actions[bot]` outright — it has no reviewer seat, so a request posted
# by the default token is refused in seconds without the diff ever being read.
# MEASURED: three of three such requests were rejected that way.
#
# So the "never obtains the head code" property below is NOT belt-and-braces any
# more. It is the ONLY thing standing between an outside author and a
# maintainer-scoped token, and it must be preserved exactly:
#   - no `actions/checkout`
#   - no build, no install, no test
#   - no `run:` step, and nothing that consumes PR-authored content
#   - every `uses:` PINNED TO A COMMIT SHA. `@v9` is a mutable tag: whoever can
#     re-point it chooses the code that runs next to the token. (A tag OBJECT
#     sha is equally immutable, being content-addressed; the commit form is
#     pinned because it is the documented and tool-recognised one, not because
#     the other is forgeable.)
# The workflow reads metadata through the API and posts one comment. Nothing an
# author writes is executed, and the one author-influenced input — WHICH issue is
# linked — decides nothing on its own: the issue must be in this repository, must
# carry a label only a maintainer can set, and must be ASSIGNED BY A MAINTAINER
# to this PR's author. No author-supplied string is interpolated into a shell, a
# template, or a query.
#
# WHICH ACCOUNT OWNS THE TOKEN IS THE LOAD-BEARING PROPERTY, not its scope. The
# reviewer accepts a request because the AUTHOR holds a reviewer seat. A token
# owned by a seatless collaborator satisfies every permission requirement here
# and still reproduces the exact defect this split was made to fix, silently.
#
# Scope it as narrowly as the platform allows: fine-grained, `Pull requests:
# write` and nothing else, ideally this repository only. (Posting a comment on a
# PR is an Issues-API call, which `Pull requests: write` satisfies.) What matters
# for containment is what it CANNOT do: push, merge, or reach a private
# repository. Read access to public repositories is not a meaningful escalation,
# since that content is public already. It is handed ONLY to the
# final post step, which contains no eligibility logic and no author-derived
# value beyond an integer PR number. The eligibility step below runs on the
# default `GITHUB_TOKEN`, which is now read-only.
#
# The one-review-per-issue budget further down is a courtesy bound, not part of
# this boundary: it reads author-mutable state and must never be relied on as a
# control. Assignment is what holds.
#
# One side effect worth stating, because it is invisible until it matters: a
# comment posted by a PAT DOES start other workflow runs, where one posted by
# GITHUB_TOKEN does not. Every request here therefore also fires the
# `issue_comment` triggers elsewhere in this repository. Checked: none of them
# comment back, so nothing loops. Re-check that before adding one that does.
#
# Keep it that way. If this workflow ever needs to inspect the diff, that work
# belongs in a separate `pull_request` job with the default read-only token.
# A SECOND JOB IS NOT AN ESCAPE HATCH: the test enumerates every job in this
# file, so a checkout added anywhere here fails, not just one added above.

on:
  # ELIGIBILITY IS A FUNCTION OF TWO OBJECTS — the pull request AND the issue —
  # so BOTH sides are watched. Listening to only one is why the most natural
  # real sequence never fired: a contributor opens a PR, and the maintainer
  # assigns them AFTERWARDS. Nothing re-evaluated that, so the automation this
  # workflow exists to provide simply did not happen in the common case.
  pull_request_target:
    # `opened` is the normal case. `ready_for_review` covers a PR opened as a
    # draft. `edited` covers the closing link arriving late — the contributor
    # opens the PR and then adds "Closes #N", which is the common path, not an
    # edge case. `reopened` covers a PR whose eligibility changed while closed.
    types: [opened, ready_for_review, edited, reopened]
  issues:
    # The maintainer half of the predicate. Each of these is the moment
    # eligibility can BECOME true for a PR that already exists and already
    # links the issue.
    #
    # Safe to widen to: every one of these actions requires triage permission,
    # so an outside contributor cannot emit them. This is the maintainer saying
    # "go", which is exactly the signal the workflow was missing.
    types: [assigned, labeled, reopened]
  label:
    # The label itself is a THIRD object with exactly one eligibility-flipping
    # mutation: RENAMING an existing label to `good first issue` attaches the
    # invited name to every issue already carrying it — and GitHub emits no
    # `issues` event for that, only this repository-level one. `created` cannot
    # flip eligibility (a fresh label is attached to nothing yet — attaching it
    # later fires `issues: labeled`), and `deleted`/renamed-away only make
    # eligibility FALSE, which needs no trigger: every claim re-validates from
    # live state anyway. Editing labels requires push access, so this is
    # maintainer-only, same as the issues actions above.
    types: [edited]

# Least privilege. The default token now holds NO elevated scope: the only write
# this workflow performs is the trigger comment, and that is posted by the
# separate maintainer-token step, not by `GITHUB_TOKEN`.
permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # Serialises repeat events for the SAME subject — a draft opened then marked
  # ready, or a burst of body edits. It cannot serialise across subjects, which
  # is why the budget below is documented as best-effort rather than exact.
  group: contributor-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.label.name }}
  # Supersede rather than queue. Every run recomputes eligibility from current
  # state, so an in-flight run is never worth more than the one behind it, and
  # queueing a burst of body edits would just serialise identical work. The run
  # that survives sees the latest state; the budget check still prevents a
  # second request if an earlier run already posted.
  cancel-in-progress: true

jobs:
  request-review:
    runs-on: ubuntu-latest
    # A cheap pre-filter ONLY, and only for PR events. It is not the eligibility
    # rule and must not be read as one: the script applies the real predicate to
    # every candidate, this PR included, from LIVE data. A condition enforced
    # here and not there is how the two drift apart.
    if: >-
      github.event_name == 'issues' ||
      github.event_name == 'label' ||
      (github.event.pull_request.head.repo.full_name != github.repository &&
       github.event.pull_request.draft == false)
    steps:
      - name: Decide whether this PR has earned an automatic review
        id: eligible
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // ─────────────────────────────────────────────────────────────
            // ONE DEFINITION OF "ELIGIBLE", APPLIED TO EVERY PR FROM LIVE DATA.
            //
            // Read this before changing anything. Two design facts here were
            // each learned the expensive way, and both look like details.
            //
            // 1. ELIGIBILITY IS A FUNCTION OF TWO OBJECTS — the pull request
            //    and the issue — and both can change independently. Nine review
            //    findings, re-read as a matrix of (object x property), were all
            //    one defect: "eligible" had no single definition, so each object
            //    got its own ad-hoc subset of the checks and every round found
            //    another empty cell. `isEligible` below is now the only place
            //    it is decided, and it runs over LIVE data for every candidate,
            //    this PR included.
            //
            // 2. THE BUDGET IS BEST-EFFORT, AND CANNOT BE MADE EXACT HERE.
            //    It is derived from `closedByPullRequestsReferences`, which is
            //    author-MUTABLE. An earlier revision added a lowest-number
            //    tie-break to make it exact, arguing that PR numbers are
            //    monotonic so a later PR always sees the earlier ones. That
            //    argument is FALSE under the `edited` trigger: a higher-numbered
            //    PR can link the issue first and scan while alone, then a
            //    lower-numbered PR links afterwards. Both then believe they won.
            //    The tie-break is gone rather than patched, because it existed
            //    to manufacture an exact bound out of inexact state — which is
            //    the part that cannot be done. Making it exact needs a
            //    bot-owned durable claim on the issue, i.e. `issues: write` on a
            //    `pull_request_target` workflow, which is a bigger grant than
            //    this convenience feature is worth.
            //
            //    So the budget is a COURTESY BOUND: it stops the ordinary repeat
            //    cases, and two simultaneous claims can still both post. That is
            //    a wasted review, not a breach. THE SECURITY PROPERTY IS
            //    `isEligible`, and specifically the assignment, which no author
            //    can grant themselves.
            // ─────────────────────────────────────────────────────────────

            const INVITED = ['good first issue', 'first-timers-only'];
            const MAX_LINKED_PRS = 30;
            const MAX_LINKED_ISSUES = 20;

            const R = { owner: context.repo.owner, repo: context.repo.repo };
            const SELF_REPO = `${R.owner}/${R.repo}`;

            /**
             * THE predicate. `candidate` always comes from the live GraphQL
             * node, never from a webhook payload — a payload is a snapshot of
             * the moment the event fired, and a PR can be closed or returned to
             * draft between the event and this job running.
             */
            function isEligible(candidate, issue, why) {
              const author = (candidate.author || '').toLowerCase();
              const checks = {
                'pr is open':        candidate.state === 'OPEN',
                'pr is not a draft': candidate.isDraft === false,
                'pr is from a fork': candidate.isCrossRepository === true,
                'issue is open':     issue.state === 'open',
                'issue is invited':  (issue.labels || []).some(l =>
                  INVITED.includes(((typeof l === 'string' ? l : l.name) || '').toLowerCase())),
                'issue is assigned to the pr author': (issue.assignees || []).some(
                  a => ((a && a.login) || '').toLowerCase() === author && author !== ''),
              };
              const failed = Object.keys(checks).filter(k => !checks[k]);
              if (failed.length && why) core.info(`  ${why}: ${failed.join('; ')}`);
              return failed.length === 0;
            }

            // GitHub logins are case-insensitive, so a human's "@Codex review"
            // is the same request as "@codex review". Matching case-sensitively
            // made the workflow post a SECOND trigger after a human had already
            // asked. This repo's own escalation guard lowercases for the same
            // reason (scripts/hooks/git_push_guard.py).
            // ── What counts as "the review was already requested" ────────────
            // TWO DIFFERENT QUESTIONS, and conflating them is the bug this
            // replaces. The block below is BYTE-IDENTICAL in the post step, and
            // a test asserts that, because two copies of a predicate that drift
            // is how the budget stops recognising its own requests.
            //
            // 1. DID WE POST ONE? Exact equality against the body this workflow
            //    writes, never containment. The marker literal is published in
            //    this file, in the test, and in the changelog, so a maintainer
            //    pasting any of those onto a PR to explain the mechanism would
            //    otherwise spend that issue's only automatic review -- the exact
            //    false-seal this change removes, reintroduced by its own fix.
            //    Quoting a body inside prose cannot equal it.
            //
            // 2. DID A HUMAN ASK? Deliberately counted: if a maintainer already
            //    typed the request, asking again just spends a second review.
            //    This one cannot be exact, so it is a judgement about SHAPE.
            //
            //    MEASURED over the 1000 most recent comments on this repository
            //    (2026-09-25): 373 bodies contain the request string, and 95 of
            //    them are the REVIEWER'S OWN footer, which reads `Comment
            //    "@codex review" or ...`. That footer lands on a PR BEFORE any
            //    human asks, so matching the string anywhere meant the reviewer
            //    sealed the issue's only review by introducing itself. This
            //    feature had a second reason it never worked.
            //
            //    The discriminator: a mention with text on BOTH sides of it on
            //    one line is prose ("I think @codex review is the wrong
            //    trigger", and that footer). A mention that BEGINS a line or
            //    ENDS one is a request. Anchoring to the start alone loses none
            //    of the 373 (measured), and the end anchor adds 0 more on this
            //    corpus -- it is there for `please @codex review`, a shape with
            //    no measured instances, so call it precaution, not a fix.
            //    A quoted line counts: a quote is evidence a request happened,
            //    and withholding a review is the safe side of that guess.
            const REQUEST = '@codex review';
            const REQUEST_MARKER = '<!-- genesis-auto-review-request -->';
            const OUR_REQUEST = `${REQUEST}\n\n${REQUEST_MARKER}`;
            const REQUEST_STARTS_LINE = /^[ \t>]*@codex\s+review\b/im;
            const REQUEST_ENDS_LINE = /(?:^|[\s>])@codex\s+review[ \t]*$/im;
            const alreadyRequested = (body) =>
              !!body &&
              (body.trim() === OUR_REQUEST ||
                REQUEST_STARTS_LINE.test(body) ||
                REQUEST_ENDS_LINE.test(body));

            const linkQ = `
              query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    closingIssuesReferences(first: 50, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { number repository { nameWithOwner } }
                    }
                  }
                }
              }`;

            const prsForIssueQ = `
              query($owner:String!, $repo:String!, $issue:Int!, $cursor:String) {
                repository(owner:$owner, name:$repo) {
                  issue(number:$issue) {
                    closedByPullRequestsReferences(first: 30, after: $cursor, includeClosedPrs: true) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        number
                        state
                        isDraft
                        isCrossRepository
                        repository { nameWithOwner }
                        author { login }
                        comments(first: 100) { pageInfo { hasNextPage } nodes { body } }
                      }
                    }
                  }
                }
              }`;

            /** Every PR that closes `issueNumber`, live, paginated, capped. */
            async function prsClosing(issueNumber) {
              const out = [];
              let cur = null;
              for (;;) {
                const d = await github.graphql(prsForIssueQ, { ...R, issue: issueNumber, cursor: cur });
                const conn = d.repository.issue.closedByPullRequestsReferences;
                // Closing references CROSS repositories: a PR elsewhere can say
                // "closes <owner>/<repo>#N" about OUR issue, and a same-numbered
                // foreign node would then be read by every consumer of this list
                // as if it were ours — the spent-budget walk would decline our
                // real PR over a stranger's comment, and the candidate lookup
                // below would validate the foreign PR's author/state under our
                // number. The mirror function (issuesClosedBy) has always
                // filtered its direction; this one never did. Filter at the ONE
                // producer, so no consumer has to remember.
                out.push(...(conn.nodes || []).filter(
                  n => n.repository && n.repository.nameWithOwner === SELF_REPO));
                if (out.length > MAX_LINKED_PRS) {
                  core.info(
                    `Issue #${issueNumber} has more than ${MAX_LINKED_PRS} linked PRs — ` +
                    `cannot establish whether its review was already requested; declining.`
                  );
                  return null;
                }
                if (!conn.pageInfo.hasNextPage) break;
                cur = conn.pageInfo.endCursor;
              }
              return out;
            }

            /** Invited issues that `prNumber` closes, in THIS repository. */
            async function issuesClosedBy(prNumber) {
              const linked = [];
              let cur = null;
              for (;;) {
                const d = await github.graphql(linkQ, { ...R, number: prNumber, cursor: cur });
                const conn = d.repository.pullRequest.closingIssuesReferences;
                linked.push(...(conn.nodes || []));
                if (linked.length > MAX_LINKED_ISSUES) {
                  core.info(
                    `PR #${prNumber} closes more than ${MAX_LINKED_ISSUES} issues — ` +
                    `declining rather than fanning out on request.`
                  );
                  return [];
                }
                if (!conn.pageInfo.hasNextPage) break;
                cur = conn.pageInfo.endCursor;
              }
              return linked
                .filter(i => i.repository && i.repository.nameWithOwner === SELF_REPO)
                .map(i => i.number);
            }

            /**
             * May `prNumber` claim `issueNumber`'s automatic review?
             *
             * ORDER MATTERS, and getting it wrong was a real finding: the spent
             * check runs over EVERY linked PR before any eligibility filtering.
             * A PR that received a review and was later closed is no longer
             * eligible, but the review it consumed is still spent — filtering
             * it out first made the budget look untouched and let a replacement
             * PR spend a second one.
             */
            async function mayClaim(prNumber, issueNumber) {
              const { data: issue } = await github.rest.issues.get({ ...R, issue_number: issueNumber });
              const nodes = await prsClosing(issueNumber);
              if (nodes === null) return false;

              for (const n of nodes) {
                if (n.comments.pageInfo.hasNextPage) {
                  core.info(
                    `PR #${n.number} (closing #${issueNumber}) has more comments than one ` +
                    `page — cannot establish whether a review was requested; declining.`
                  );
                  return false;
                }
                if ((n.comments.nodes || []).some(c => alreadyRequested(c.body))) {
                  core.info(
                    `Issue #${issueNumber} already spent its automatic review on ` +
                    `PR #${n.number} — not requesting another.`
                  );
                  return false;
                }
              }

              // Live state for the candidate, from the same walk that judged
              // every other PR. Falling back to a lookup covers the window
              // before the closing link is indexed.
              let node = nodes.find(n => n.number === prNumber);
              if (!node) {
                const d = await github.graphql(
                  `query($owner:String!,$repo:String!,$number:Int!){
                     repository(owner:$owner,name:$repo){
                       pullRequest(number:$number){
                         number state isDraft isCrossRepository author { login } } } }`,
                  { ...R, number: prNumber });
                node = d.repository.pullRequest;
              }
              const candidate = {
                number: node.number,
                author: (node.author && node.author.login) || '',
                state: node.state,
                isDraft: node.isDraft,
                isCrossRepository: node.isCrossRepository,
              };
              return isEligible(candidate, issue, `PR #${prNumber} vs issue #${issueNumber}`);
            }

            // ── Which PRs does THIS event ask us to consider? ────────────────
            // A pull_request event names one. An issue event — the maintainer
            // assigning, labelling or reopening — is the moment eligibility can
            // become true for PRs that already exist, so every PR closing that
            // issue is reconsidered, lowest number first.
            let candidates;
            if (context.eventName === 'issues') {
              const issueNumber = context.payload.issue.number;
              const nodes = await prsClosing(issueNumber);
              if (!nodes) return;
              candidates = nodes.map(n => n.number).sort((a, b) => a - b);
              core.info(
                `Issue #${issueNumber} ${context.payload.action} — reconsidering ` +
                `${candidates.length} linked PR(s).`
              );
            } else if (context.eventName === 'label') {
              // A rename INTO an invited name flips eligibility for every open
              // issue already carrying the label, silently. Only the new name
              // matters: renamed-away makes eligibility false, and false needs
              // no trigger (every claim re-validates from live state).
              const newName = ((context.payload.label || {}).name || '');
              if (!INVITED.includes(newName.toLowerCase())) {
                core.info(`Label edit ("${newName}") is not an invited name — nothing to do.`);
                return;
              }
              // One page, and SAY SO when it truncates: an install with 100+
              // open issues under one invited label is far past the point where
              // an automatic courtesy trigger is the right tool anyway.
              const { data: listed } = await github.rest.issues.listForRepo({
                ...R, labels: newName, state: 'open', per_page: 100,
              });
              const issues = listed.filter(i => !i.pull_request);
              if (listed.length === 100) {
                core.info(
                  `More than one page of open issues carries "${newName}" — ` +
                  `reconsidering only the first 100; touch older issues ` +
                  `(relabel/reassign) to reconsider them.`
                );
              }
              const seen = new Set();
              candidates = [];
              for (const issue of issues) {
                const nodes = await prsClosing(issue.number);
                for (const n of nodes || []) {
                  if (!seen.has(n.number)) { seen.add(n.number); candidates.push(n.number); }
                }
              }
              candidates.sort((a, b) => a - b);
              core.info(
                `Label "${newName}" now carries an invited name — reconsidering ` +
                `${candidates.length} linked PR(s) across ${issues.length} open issue(s).`
              );
            } else {
              candidates = [context.payload.pull_request.number];
            }

            for (const prNumber of candidates) {
              for (const issueNumber of await issuesClosedBy(prNumber)) {
                if (!(await mayClaim(prNumber, issueNumber))) continue;
                // The REQUEST ITSELF is posted by the next step, under a
                // maintainer identity. It cannot be posted here: this step runs
                // on GITHUB_TOKEN, and a request authored by github-actions[bot]
                // is rejected by the reviewer on identity alone, before the diff
                // is ever read. Hand the decision on; do not widen this token.
                core.setOutput('pr', String(prNumber));
                core.setOutput('issue', String(issueNumber));
                core.info(
                  `PR #${prNumber} has earned a review — it closes invited issue ` +
                  `#${issueNumber}, which is assigned to its author, and that issue's ` +
                  `automatic review had not been requested.`
                );
                return;   // one review per run
              }
            }
            core.info('No claimable PR/issue pair — no review requested.');

      # The ONLY step that holds the maintainer token, and the only one that
      # writes. It decides NO eligibility: it posts a fixed string to an integer
      # PR number the previous step already validated. Keep it that way — every
      # line added here is a line running next to a privileged credential in a
      # `pull_request_target` context.
      #
      # It does perform ONE read, and the distinction matters because an earlier
      # version of this comment claimed there was no logic here at all. Before
      # writing, it re-reads this PR's own comments and declines if a request is
      # already present. It exists because the concurrency group is keyed on the
      # event name and cannot serialise a `pull_request` run against an `issues`
      # run naming the same PR.
      #
      # Two nouns, kept apart, because a review pointed out that conflating them
      # is how this comment would become another false reassurance:
      #   AUTHORITY is unchanged. The check can only ever stop a post, never
      #     authorise one -- `createComment` is the single mutation and is
      #     reached only when the check passes, so no path leads from the read to
      #     a post that would not have happened anyway.
      #   ATTACK SURFACE is wider, and that is the honest cost. The step now
      #     branches on third-party-controlled text while holding the
      #     credential. Two consequences: any commenter can VETO the request by
      #     writing a body the predicate recognises (which is a request, so the
      #     veto is indistinguishable from the thing it suppresses), and a failed
      #     read is an externally-influenced job failure. The comparison is a
      #     literal string match -- no eval, no interpolation, no shell.
      - name: Post the review request under a maintainer identity
        if: steps.eligible.outputs.pr != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # EVERYTHING the script reads arrives through env, never through a
          # `${{ }}` interpolation into the script body. Actions substitutes those
          # BEFORE node parses the file, so an interpolated value is code, not
          # data — the standard `actions/github-script` injection shape. These two
          # values are integers from the API and not author text, but the rule is
          # kept mechanical rather than argued case by case.
          #
          # MAINTAINER_TOKEN is read separately from `github-token` so the script
          # can tell "secret absent" from "secret present": with the fallback
          # below octokit is constructed either way, and posting under the WRONG
          # identity is the exact defect this workflow exists to fix.
          MAINTAINER_TOKEN: ${{ secrets.REVIEW_REQUEST_TOKEN }}
          TARGET_PR: ${{ steps.eligible.outputs.pr }}
          TARGET_ISSUE: ${{ steps.eligible.outputs.issue }}
        with:
          # The fallback keeps the step from failing to initialise when the secret
          # is unset. It is never used to post: the guard below returns first.
          github-token: ${{ secrets.REVIEW_REQUEST_TOKEN || github.token }}
          script: |
            const prNumber = Number(process.env.TARGET_PR);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed('Refusing to comment: bad PR number from the eligibility step.');
              return;
            }
            if (!process.env.MAINTAINER_TOKEN) {
              core.warning(
                `REVIEW_REQUEST_TOKEN is not configured, so no review was requested for PR ` +
                `#${prNumber}. Posting under the default token is not a fallback: the ` +
                `reviewer rejects a bot-authored request on identity alone. Set a ` +
                `fine-grained token (this repository, Pull requests: write) to enable this.`
              );
              return;
            }
            // BYTE-IDENTICAL to the block in the eligibility step above, which
            // carries the rationale and the measurements. A test asserts the two
            // copies match: an earlier version of this step re-derived a WEAKER
            // marker-only check, so a human who typed the request during the
            // window between the two steps was invisible here and got a
            // duplicate request on top of their own.
            const REQUEST = '@codex review';
            const REQUEST_MARKER = '<!-- genesis-auto-review-request -->';
            const OUR_REQUEST = `${REQUEST}\n\n${REQUEST_MARKER}`;
            const REQUEST_STARTS_LINE = /^[ \t>]*@codex\s+review\b/im;
            const REQUEST_ENDS_LINE = /(?:^|[\s>])@codex\s+review[ \t]*$/im;
            const alreadyRequested = (body) =>
              !!body &&
              (body.trim() === OUR_REQUEST ||
                REQUEST_STARTS_LINE.test(body) ||
                REQUEST_ENDS_LINE.test(body));

            // Re-read THIS PR's comments immediately before writing. The
            // eligibility step decided seconds ago, and the concurrency group is
            // keyed on the EVENT NAME, so a `pull_request` run and an `issues`
            // run naming this same PR sit in different groups and can arrive
            // here together.
            //
            // This does NOT close that race — two runs can both read clean
            // before either writes. It narrows it from the seconds between two
            // steps to the milliseconds between this read and the write, which
            // is what stops the realistic case: a maintainer assigning the issue
            // while the author edits the PR body.
            //
            // It is the only logic in this step, and it reads comment bodies,
            // which are author-influenced. They are compared against a literal
            // and never executed, interpolated, or handed to a shell — the same
            // treatment the eligibility step gives them. Paginated rather than
            // capped: a truncated read of a long thread would look exactly like
            // "no request exists".
            let posted;
            try {
              posted = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
            } catch (err) {
              // Fail CLOSED for every error `paginate` propagates: unable to
              // read is not the same as nothing found, and a duplicate request
              // spends a review that cannot be refunded.
              //
              // ONE source-verified hole, stated rather than papered over:
              // octokit's plugin-paginate-rest swallows a 409 in its iterator
              // and yields a synthesized empty page, so a 409 would read as "no
              // request exists". 409 is not a documented status for this
              // endpoint, and engineering around it is not worth the code.
              //
              // Accepted cost of being loud: `@actions/github` composes Octokit
              // with no retry or throttling plugin, so a transient 5xx on this
              // read turns an outside contributor's first PR check red. That is
              // the failure this file elsewhere works to avoid -- taken
              // deliberately, because this feature's entire history is being
              // silently broken, and a quiet warning nobody reads is how it
              // stayed that way.
              core.setFailed(
                `Could not read PR #${prNumber} comments to confirm no request ` +
                `exists, so no request was posted: ${err.message}`
              );
              return;
            }
            if (posted.some(c => alreadyRequested(c.body))) {
              core.info(
                `PR #${prNumber} already carries an automatic review request — ` +
                `a concurrent run posted it. Not posting a second one.`
              );
              return;
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                // The marker goes in the body so the budget recognises this
                // request exactly, rather than by matching its prose. An HTML
                // comment does not render, and the reviewer already answers a
                // request carrying extra text around it.
                body: `${REQUEST}\n\n${REQUEST_MARKER}`,
              });
            } catch (err) {
              // An EXPIRED or revoked token throws here. Unhandled, that is a red
              // job on an outside contributor first PR with nothing saying why.
              core.setFailed(
                `Could not post the review request on PR #${prNumber}: ${err.message}. ` +
                `If this is a 401 or 403 the REVIEW_REQUEST_TOKEN has expired or lost ` +
                `its Pull requests: write permission.`
              );
              return;
            }
            core.info(
              `Requested a review on PR #${prNumber} (closes invited issue ` +
              `#${process.env.TARGET_ISSUE}) under a maintainer identity.`
            );
