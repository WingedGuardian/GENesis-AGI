name: merge-gate-publish

# Trusted second stage of the merge-gate check (issue #1670).
#
# `pull_request_review[_comment]` events on FORK PRs run the merge-gate
# workflow under a read-only GITHUB_TOKEN — it can evaluate the gate but
# cannot write the verdict onto the PR head. When that happens, the
# untrusted run uploads a `merge-gate-verdict` artifact containing ONLY
# the PR number and exits. This workflow fires on every merge-gate
# completion with the default-branch token; its job runs only for the
# completions that could carry a handoff (see the job's `if:`), checks for
# the artifact,
# RE-EVALUATES the gate itself, and publishes the check run on the head
# SHA. The artifact is only a pointer — an untrusted run can ask for an
# evaluation but cannot influence the verdict or the target SHA, both of
# which are re-derived here from live PR state.
#
# No loop hazard: stage 1's workflow_run trigger listens for `CI` only,
# and this workflow's trigger listens for `merge-gate` only — neither
# can re-fire the other.

on:
  workflow_run:
    workflows: [merge-gate]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write
  statuses: read
  actions: read # read the triggering run's artifacts

jobs:
  publish:
    # Start a runner only for a merge-gate run that could have left a handoff
    # (#4261: this job used to start on EVERY merge-gate completion, most of
    # them cancelled or comment-triggered, only to find no artifact and exit).
    # A handoff is uploaded only by these three events, and only on a fork or
    # Dependabot PR: see the "Publish" step's `case` in merge-gate.yml. A new
    # handoff event added there must be added here too, or its verdicts are
    # silently never published. `failure` and `timed_out` still run: a run can
    # fail after its upload. A `cancelled` run can also hold an artifact (the
    # upload is followed by post steps). Concurrency cancels it only for a NEWER
    # run in the same PR's merge-gate group, which hands off or publishes
    # itself; a run cancelled by hand after its upload is not published.
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      contains(fromJSON('["pull_request","pull_request_review","pull_request_review_comment"]'),
               github.event.workflow_run.event)
    # Concurrency is job-level, so that a run whose job is skipped above does
    # not take part in it (inferred: GitHub's concurrency docs do not say how a
    # skipped job is treated). The key is unchanged from before #4261: the PR
    # number when the payload carries one, else the triggering run id, so fork
    # publishers (whose `pull_requests` is empty) never cancel each other.
    # No payload field identifies a fork PR safely. `head_repository` is the
    # BASE repo on a fork PR's review runs (measured on fork PR #4228), and
    # `head_sha` can be shared by two PRs, so keying on it would let one PR's
    # run cancel another PR's publisher. Only the artifact names the PR, and it
    # is read mid-job.
    #
    # There is NO supersede check in the publish step (#3820): it posts the
    # verdict it evaluated, so two publishers for one fork PR can still post
    # out of order. That race is unchanged by #4261.
    concurrency:
      group: merge-gate-publish-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the handoff artifact
        id: handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          aid=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select((.name | startswith("merge-gate-verdict")) and .expired == false) | .id] | first // ""')
          if [ -z "$aid" ]; then
            # Most merge-gate runs publish directly and leave no handoff.
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > verdict.zip
          pr=$(unzip -p verdict.zip merge-gate-verdict.json | jq -r '.pr')
          case "$pr" in ''|*[!0-9]*) echo "handoff artifact carries no PR number"; exit 1 ;; esac
          echo "have=true" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Resolve the PR's current head and base
        id: pr
        if: steps.handoff.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr view "${{ steps.handoff.outputs.pr }}" --repo "$GITHUB_REPOSITORY" \
            --json baseRefOid,headRefOid \
            -q '"base=" + .baseRefOid, "head=" + .headRefOid' >> "$GITHUB_OUTPUT"

      - name: Checkout the base's gate
        if: steps.handoff.outputs.have == 'true'
        uses: actions/checkout@v7
        with:
          # Same posture as stage 1: evaluate with the BASE's reviewed
          # guard, never the PR's head code — this run's token can write.
          ref: ${{ steps.pr.outputs.base }}

      - name: Set up Python
        if: steps.handoff.outputs.have == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pyyaml and markdown-it-py
        if: steps.handoff.outputs.have == 'true'
        run: pip install pyyaml "markdown-it-py>=3"

      - name: Re-evaluate the merge gate
        id: gate
        if: steps.handoff.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _TEST_CANONICAL_PUBLIC_REPO: WingedGuardian/GENesis-AGI
        run: |
          set +e
          python3 scripts/hooks/git_push_guard.py \
            --check-pr "${{ steps.handoff.outputs.pr }}" \
            --repo "$GITHUB_REPOSITORY"
          rc=$?
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish the verdict on the PR head
        if: steps.handoff.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_RC: ${{ steps.gate.outputs.rc }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          PR_NUMBER: ${{ steps.handoff.outputs.pr }}
        run: |
          set -euo pipefail
          if [ "$GATE_RC" = "0" ]; then
            concl=success; title="merge gate: all gates pass"
          else
            concl=failure; title="merge gate: blocks reported — see run log"
          fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="genesis-merge-gate" \
            -f head_sha="$HEAD_SHA" \
            -f status=completed \
            -f conclusion="$concl" \
            -f "output[title]=$title" \
            -f "output[summary]=Merge-gate re-evaluation of PR #${PR_NUMBER} via the trusted publisher (fork-PR and Dependabot runs cannot write check runs). The full gate report is in this run's 'Re-evaluate the merge gate' step log." \
            -f "details_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
