name: Runner benchmark

# An A/B of the test suite across runner providers, run ON DEMAND ONLY.
#
# WHY dispatch-only: the merge gate reads ANY red check as "CI red"
# (`git_push_guard.py` `_ci_status`: `if red: return "red"`, not scoped to
# required workflows). A benchmark attached to `push` or `pull_request` would,
# the first time a provider hiccuped, mark EVERY open PR red and stop the queue.
#
# ⚠ `workflow_dispatch` does NOT make that impossible, and an earlier version of
# this comment claimed it did ("attaches to nothing"). Check runs key by COMMIT
# SHA, not by triggering event: dispatch this against a ref that is an open PR's
# head and its check lands in that PR's rollup anyway, where a red arm blocks the
# merge gate and a running arm stalls it. Dispatch-only removes the AUTOMATIC
# path, not every path.
#
# So the job's conclusion is made robust instead of relying on that claim — see
# `continue-on-error` on the pytest step. Residual, stated rather than implied: a
# TIMEOUT or an infrastructure failure still fails the job, so do not dispatch
# this against a branch that is an open PR's head. Genesis's own gate is the only
# thing at risk — the native ruleset requires `test`, `leak-detector` and `lint`
# by name, so a red benchmark cannot block GitHub's merge button.
#
# WHY both arms in ONE run rather than comparing against historical medians:
# a median over 30 days mixes commits, dependency sets and queue conditions.
# Running both arms on the same ref at the same moment controls all three, so
# the difference that remains is the runner.
#
# WHY run it TWICE to draw a conclusion: the vendor's own guidance is that the
# first run shows hardware and the second shows cache. A single run measures
# the cold case only, and reporting that as "the speedup" would understate a
# cache-heavy provider and overstate a cold-fast one.

on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: >-
          Extra args appended to pytest. Default is the full suite, matching
          CI's `test` job. Narrow it (e.g. `tests/test_memory`) for a cheap
          smoke of the harness itself before spending on a full run.
        required: false
        default: ""

# A third-party runner executes this job on its own hardware, so state what it
# receives rather than leaving it to be inferred: no `secrets.*` is referenced
# anywhere below, and `permissions` is narrowed to `contents: read`, so the only
# credential THIS RUN hands the provider is a read-scoped GITHUB_TOKEN. That is
# the minimum a checkout needs and it cannot write to the repo. Widening these
# permissions, or adding a secret, changes what an external provider holds — do
# it deliberately, not as a side effect of adding a step.
#
# That bounds the per-job token and NOTHING ELSE. The provider's runners exist
# because of a standing GitHub App installation on the account, which carries
# its own separate grant that no line in this file constrains or describes. The
# scope of that grant is a question for whoever owns the installation; it is not
# answered here, and an earlier version of this comment read as though it were.
permissions:
  contents: read

concurrency:
  # Never let two benchmarks overlap: they would compete for the same cache
  # and for a shared runner pool, which is precisely the variable this is
  # trying to hold still. Queue rather than cancel — a cancelled arm yields
  # no measurement, and an incomplete pair is worse than a late one.
  group: runner-benchmark
  cancel-in-progress: false

jobs:
  bench:
    name: ${{ matrix.arm.label }}
    strategy:
      # Both arms always run. Without this a failure in one arm cancels the
      # other, and a pair with one side missing measures nothing.
      fail-fast: false
      matrix:
        arm:
          - label: github-2vcpu
            runs-on: ubuntu-latest
          # Deliberately the 2-vCPU size: it is what `avrea-ubuntu-latest`
          # resolves to and what GitHub's default provides, so this pair
          # isolates the HARDWARE and leaves machine size out of it. A larger
          # arm answers a different question ("what would paying buy?") and
          # belongs in a separate run, not mixed into this one.
          - label: avrea-2vcpu
            runs-on: avrea-ubuntu-latest
    runs-on: ${{ matrix.arm.runs-on }}
    # Bounds the blast radius of a single benchmark rather than the suite's
    # legitimate worst case — CI's `test` job carries 180 for that reason and
    # this is not that job. MEASURED baseline for the control arm: p50 29m22s,
    # max 31m15s over 23 successful main runs (2026-09-06). 60 leaves roughly
    # double the observed max and caps what one misbehaving run can spend.
    timeout-minutes: 60
    steps:
      - name: Record start
        id: t0
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # fetch-depth: 0 mirrors CI's `test` job, where it is load-bearing —
      # measurement tests derive a rate from this repository's commit history
      # and SKIP on a shallow clone. It is also a real part of the cost being
      # measured, so shortening it here would flatter both arms unequally.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # This job only READS the tree, and one of its two arms runs on
          # infrastructure outside GitHub's trust boundary — which is exactly
          # the case ci.yml's read-only jobs already set this for. Persisted
          # credentials otherwise sit in `.git/config` for every later step,
          # and for the host, for no benefit.
          persist-credentials: false

      - name: Record post-checkout
        id: t1
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Record post-install
        id: t2
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: pytest
        # `continue-on-error` so a failing suite cannot turn this JOB red.
        # That matters because a red job reaches the PR rollup that Genesis's
        # merge gate reads (see the header), and a benchmark must never be able
        # to block a merge.
        #
        # It hides nothing: `steps.pytest.outcome` keeps the true result and the
        # summary below prints it. An earlier version of this file refused
        # `continue-on-error` on the grounds that it would "paint a red suite
        # green" — that conflated two different things. What it suppresses is
        # the job's CONCLUSION, which is a signal to other automation; the
        # measurement, and the pass/fail report, are untouched.
        continue-on-error: true
        run: |
          rm -f junit.xml
          # PYTEST_ARGS arrives through `env`, never interpolated into this
          # script. A `${{ }}` expansion here would be substituted as TEXT
          # before bash ever sees it, so a dispatch input containing shell
          # metacharacters would execute — the standard Actions script
          # injection. Through `env` the value is only ever data.
          #
          # Unquoted on purpose so several args split into several words;
          # that is the whole point of the input. It also means globbing
          # applies, which is harmless for a benchmark knob and is why this
          # input is documented as "extra pytest args" rather than a path.
          # shellcheck disable=SC2086
          pytest -v --durations=25 \
            --ignore-glob='**/test_*az*.py' \
            --ignore-glob='**/test_*shim*.py' \
            --ignore=tests/test_ui/ \
            --junit-xml=junit.xml $PYTEST_ARGS
        env:
          GENESIS_TESTING: "1"
          PYTEST_ARGS: ${{ inputs.pytest_args }}

      - name: Record end
        id: t3
        if: ${{ always() }}
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # A single total cannot tell a cache win from a CPU win, and those have
      # different consequences: a cache win shrinks with a warm GitHub cache
      # too, while a CPU win does not. The phase split is what makes the
      # result actionable rather than merely favourable.
      - name: Phase timings
        if: ${{ always() }}
        env:
          T0: ${{ steps.t0.outputs.epoch }}
          T1: ${{ steps.t1.outputs.epoch }}
          T2: ${{ steps.t2.outputs.epoch }}
          T3: ${{ steps.t3.outputs.epoch }}
          ARM: ${{ matrix.arm.label }}
          RUNS_ON: ${{ matrix.arm.runs-on }}
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          set -u
          # A missing timestamp means the step before it never ran. Report the
          # phase as unmeasured rather than computing a difference against an
          # empty string, which would silently render as a plausible number.
          phase() {
            local name=$1 start=$2 end=$3
            if [ -z "$start" ] || [ -z "$end" ]; then
              printf '| %s | not measured |\n' "$name"
            else
              printf '| %s | %ds |\n' "$name" "$((end - start))"
            fi
          }
          {
            printf '### %s (`%s`)\n\n' "$ARM" "$RUNS_ON"
            printf 'pytest outcome: **%s**\n\n' "$PYTEST_OUTCOME"
            printf '| phase | duration |\n|---|---|\n'
            phase 'checkout' "$T0" "$T1"
            phase 'setup + install' "$T1" "$T2"
            phase 'pytest' "$T2" "$T3"
            phase 'total' "$T0" "$T3"
          } >> "$GITHUB_STEP_SUMMARY"
