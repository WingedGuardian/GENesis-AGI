name: Headlong offline controls
on:
  pull_request:
    paths:
      - '.github/workflows/headlong-controls.yml'
      - 'scripts/ci/headlong_*'
      - 'scripts/ci/ego_runtime_*.py'
      - 'scripts/ci/ego_owned_*'
      - 'tests/test_scripts/test_headlong_*.py'
      - 'tests/test_scripts/test_ego_runtime_*.py'
      - 'tests/test_scripts/test_ego_owned_*.py'
      - 'src/genesis/db/crud/ego.py'
      - 'src/genesis/db/schema/**'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: headlong-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTROL_CONTAINER: headlong-${{ github.run_id }}-${{ github.run_attempt }}
      NATIVE_CONTAINER: headlong-native-${{ github.run_id }}-${{ github.run_attempt }}
      REFERENCE_CONTAINER: headlong-reference-${{ github.run_id }}-${{ github.run_attempt }}
      BRIDGE_CONTAINER: headlong-bridge-${{ github.run_id }}-${{ github.run_attempt }}
      OWNED_CONTAINER: ego-owned-${{ github.run_id }}-${{ github.run_attempt }}
      MATRIX_CONTAINER: ego-matrix-${{ github.run_id }}-${{ github.run_attempt }}
      RECOVERY_CONTAINER: ego-recovery-${{ github.run_id }}-${{ github.run_attempt }}
      TIMING_CONTAINER: ego-timing-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: laude-institute/headlong
          ref: eab04ad4097fb2030f27bee6026e24f57289f12d
          path: upstream-headlong
          persist-credentials: false
      - name: Build credential-free evaluation image
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/headlong-context"
          mkdir -p "$context/headlong"
          test "$(git -C upstream-headlong rev-parse HEAD)" = eab04ad4097fb2030f27bee6026e24f57289f12d
          git -C upstream-headlong archive HEAD | tar -x -C "$context/headlong"
          git archive HEAD src/genesis LICENSE | tar -x -C "$context"
          git rev-parse HEAD > "$context/genesis-source-pin"
          printf '%s\n' eab04ad4097fb2030f27bee6026e24f57289f12d > "$context/headlong/.source-pin"
          cp scripts/ci/headlong_fixture.py scripts/ci/headlong_controls.py scripts/ci/headlong_native_*.py "$context/"
          cp scripts/ci/headlong_prompt_references.py scripts/ci/headlong_reference_*.py "$context/"
          cp scripts/ci/headlong_monolith_controls.py scripts/ci/headlong_bridge_patch.json "$context/"
          cp scripts/ci/ego_runtime_cases.py scripts/ci/ego_runtime_report.py "$context/"
          cp scripts/ci/ego_owned_*.py scripts/ci/ego_owned_context.sh "$context/"
          cp scripts/ci/headlong_controls.Dockerfile "$context/Dockerfile"
          docker build -t headlong-controls "$context"
          docker image inspect headlong-controls > "$RUNNER_TEMP/headlong-image.json"
      - name: Run stock controls inside disposable containment
        # Flag semantics: https://docs.docker.com/reference/cli/docker/container/run/
        run: |
          set -euo pipefail
          docker create --name "$CONTROL_CONTAINER" --init --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777 headlong-controls
          docker inspect "$CONTROL_CONTAINER" > "$RUNNER_TEMP/headlong-container.json"
          timeout 600 docker start -a "$CONTROL_CONTAINER" > "$RUNNER_TEMP/headlong-report.json"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$CONTROL_CONTAINER")" = 0
          python3 - "$RUNNER_TEMP/headlong-report.json" <<'PY'
          import itertools, json, sys
          with open(sys.argv[1]) as stream:
              report = json.load(stream)
          assert report["schema"] == "headlong-stock-controls/v1"
          assert report["source_pin"] == "eab04ad4097fb2030f27bee6026e24f57289f12d"
          assert report["status"] == "pass" and report["cleanup_confirmed"] is True
          assert report["sdk"] == "0.2.172"
          assert all(isinstance(report["dependencies"][key], str) and report["dependencies"][key].strip() for key in ("os", "python"))
          expected = set(itertools.product(("fixed", "http", "cli"), ("effect", "noop", "failure")))
          assert len(report["routes"]) == report["route_passed"] == report["route_total"] == 9
          assert {(row["route"], row["control"]) for row in report["routes"]} == expected
          assert len(report["upstream"]) == 8 and all(row["passed"] is True for row in report["upstream"] + report["routes"])
          print("9/9 route controls and 8/8 selected upstream test invocations passed")
          PY
      - name: Run pinned and adapted prompt redaction inside disposable containment
        run: |
          set -euo pipefail
          docker create --name "$REFERENCE_CONTAINER" --init --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777 \
            headlong-controls python3 /fixture/headlong_reference_controls.py
          docker inspect "$REFERENCE_CONTAINER" > "$RUNNER_TEMP/headlong-reference-container.json"
          timeout 600 docker start -a "$REFERENCE_CONTAINER" > "$RUNNER_TEMP/headlong-reference-report.json"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$REFERENCE_CONTAINER")" = 0
          python3 - "$RUNNER_TEMP/headlong-reference-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report['schema'] == 'headlong-reference-controls/v1' and report['status'] == 'pass'
          assert report['sources_unchanged'] is True and report['cleanup_confirmed'] is True
          assert len(report['cases']) == 116 and all(row['passed'] is True for row in report['cases'])
          assert len(report['upstream']) == 2 and all(row['passed'] is True for row in report['upstream'])
          print('116 reference controls plus both pinned upstream sanitizer suites passed')
          PY
      - name: Run real native SDK action port inside disposable containment
        run: |
          set -euo pipefail
          docker create --name "$NATIVE_CONTAINER" --init --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777 \
            headlong-controls python3 /fixture/headlong_native_controls.py
          docker inspect "$NATIVE_CONTAINER" > "$RUNNER_TEMP/headlong-native-container.json"
          timeout 600 docker start -a "$NATIVE_CONTAINER" > "$RUNNER_TEMP/headlong-native-report.json"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$NATIVE_CONTAINER")" = 0
          python3 - "$RUNNER_TEMP/headlong-native-report.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              report = json.load(stream)
          expected = {'echo', 'approved', 'pending', 'rejected', 'revoked', 'develop', 'duplicate', 'foreign', 'legacy', 'unknown', 'provider_error'}
          assert report['schema'] == 'headlong-native-action/v1'
          assert report['status'] == 'pass' and report['cleanup_confirmed'] is True
          assert len(report['cases']) == 11 and {row['kind'] for row in report['cases']} == expected
          assert all(row['qualification'] == 'pass' for row in report['cases'])
          assert report['instrument_control']['qualification'] == 'incomplete'
          assert report['instrument_control']['native']['is_error'] is False
          assert report['sdk'] == '0.2.172' and report['native_binary']['sha256']
          print('11/11 native cells and handler-error instrument control passed')
          PY
      - name: Run actual monolith with the native inner invocation
        run: |
          set -euo pipefail
          docker create --name "$BRIDGE_CONTAINER" --init --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777 \
            headlong-controls python3 /fixture/headlong_monolith_controls.py
          docker inspect "$BRIDGE_CONTAINER" > "$RUNNER_TEMP/headlong-bridge-container.json"
          timeout 600 docker start -a "$BRIDGE_CONTAINER" > "$RUNNER_TEMP/headlong-bridge-report.json"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$BRIDGE_CONTAINER")" = 0
          python3 - "$RUNNER_TEMP/headlong-bridge-report.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              report = json.load(stream)
          expected = {'effect', 'noop', 'refusal', 'provider_error', 'handler_error', 'large_context', 'reactive_noop', 'restart_duplicate', 'reference_continuity', 'observation_failure', 'final_failure', 'reference_conflict', 'reactive_reference_conflict'}
          assert report['schema'] == 'headlong-native-monolith/v1' and report['status'] == 'pass'
          assert report['cleanup_confirmed'] is True and report['sources_unchanged'] is True
          assert len(report['cases']) == 13 and {case['scenario'] for case in report['cases']} == expected
          manifest = report['comparison_manifest']
          assert manifest['schema'] == 'ego-runtime-mechanics/v1'
          assert len(manifest['cases']) == 13 and {case['name'] for case in manifest['cases']} == expected
          assert sum(case['wakes'] for case in manifest['cases']) == 15
          assert all(case['control_passed'] is True for case in report['cases'])
          runs = [run for case in report['cases'] for run in case['runs']]
          assert len(runs) == 15 and all(run['control_passed'] is True for run in runs)
          assert all(run['driver']['outer_source'] == 'monolith' for run in runs)
          native_runs = [run for run in runs if run['driver']['native'] is not None]
          assert len(native_runs) == 13 and report['correlations']['passed'] is True
          assert len({run['driver']['native']['session_id'] for run in native_runs}) == 13
          assert all(not case['runs'][0]['driver']['complete'] for case in report['cases'] if case['scenario'].endswith('_failure'))
          assert all(run['backend']['main_requests'] == 0 and run['driver']['prompt_status'] == '65' for case in report['cases'] if case['scenario'].endswith('reference_conflict') for run in case['runs'])
          print('13 cases / 15 wakes / 13 native sessions plus exact reader correlations verified')
          PY
      - name: Run early owned-loop native smoke inside disposable containment
        run: |
          set -euo pipefail
          docker create --name "$OWNED_CONTAINER" --init --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777 \
            headlong-controls python3 /fixture/ego_owned_controls.py
          docker inspect "$OWNED_CONTAINER" > "$RUNNER_TEMP/ego-owned-container.json"
          timeout 600 docker start -a "$OWNED_CONTAINER" > "$RUNNER_TEMP/ego-owned-report.json"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$OWNED_CONTAINER")" = 0
          python3 - "$RUNNER_TEMP/ego-owned-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report['schema'] == 'ego-owned-smoke/v1' and report['status'] == 'pass'
          assert report['sources_unchanged'] is True and report['cleanup_confirmed'] is True
          assert len(report['cases']) == 4
          assert {case['scenario'] for case in report['cases']} == {'timers', 'restart_effect', 'reactive', 'blocked'}
          assert all(case['control_passed'] is True and case['groups_closed'] is True for case in report['cases'])
          observations = [case['reports'][-1]['observations'] for case in report['cases']]
          assert sum(map(len, observations)) == 6
          sessions = [row['evidence']['driver']['native']['session_id'] for rows in observations for row in rows if row['evidence']['driver']['native'] is not None]
          assert len(sessions) == len(set(sessions)) == 5
          assert all(case['artifacts'] for case in report['cases'])
          print('4 early C smoke cases / 6 attempts / 5 native sessions verified')
          PY
      - name: Run shared C native cases and separate pure reducer population
        run: |
          set -euo pipefail
          docker create --name "$MATRIX_CONTAINER" --init --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777 \
            headlong-controls python3 /fixture/ego_owned_matrix.py
          docker inspect "$MATRIX_CONTAINER" > "$RUNNER_TEMP/ego-matrix-container.json"
          timeout 600 docker start -a "$MATRIX_CONTAINER" > "$RUNNER_TEMP/ego-matrix-report.json"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$MATRIX_CONTAINER")" = 0
          python3 - "$RUNNER_TEMP/ego-matrix-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report['schema'] == 'ego-owned-matrix/v1' and report['status'] == 'pass'
          assert report['sources_unchanged'] is True and report['cleanup_confirmed'] is True
          declared = report['declared_population']['native']['cases']
          assert len(declared) == len(report['cases']) == 13
          assert {c['scenario'] for c in report['cases']} == {c['name'] for c in declared}
          assert all(c['control_passed'] is True for c in report['cases'])
          assert sum(len(c['runs']) for c in report['cases']) == sum(c['attempts'] for c in declared) == 15
          assert report['native_sessions'] == sum(c['native_sessions'] for c in declared) == 13
          state = report['state_controls']
          assert state['status'] == 'pass'
          assert {k: len(v) for k, v in state['rows'].items()} == {'outcomes': 36, 'bursts': 17, 'guards': 6, 'pacing': 1}
          assert all(row['passed'] is True for group in state['rows'].values() for row in group)
          for group, rows in state['rows'].items():
              expected = [v['id'] if isinstance(v, dict) else v for v in report['declared_population']['state'][group]]
              actual = [v['id'] for v in rows]
              assert len(actual) == len(set(actual)) and set(actual) == set(expected)
          assert len(state['calibration']) == 144 and all(row['rejected'] is True for row in state['calibration'])
          assert len(state['journals']) == 60
          print('13 C native cases / 15 attempts / 13 native sessions; separate 60 reducer cells and 144 mutants')
          PY
      - name: Run owned-process interruption and late-I/O recovery controls
        run: |
          set -euo pipefail
          docker create --name "$RECOVERY_CONTAINER" --init --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777 \
            headlong-controls python3 /fixture/ego_owned_recovery.py
          docker inspect "$RECOVERY_CONTAINER" > "$RUNNER_TEMP/ego-recovery-container.json"
          timeout 600 docker start -a "$RECOVERY_CONTAINER" > "$RUNNER_TEMP/ego-recovery-report.json"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$RECOVERY_CONTAINER")" = 0
          python3 - "$RUNNER_TEMP/ego-recovery-report.json" "$RUNNER_TEMP/ego-recovery-container.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          container, = json.load(open(sys.argv[2]))
          assert container['HostConfig']['Init'] is True
          assert container['Config']['Cmd'] == ['python3', '/fixture/ego_owned_recovery.py']
          assert report['schema'] == 'ego-owned-recovery/v1' and report['status'] == 'pass'
          assert report['sources_unchanged'] is True and report['challenge'] is None
          declared = report['declared_population']
          assert len(report['crashes']) == len(declared['crashes']) == 12
          assert [c['stage'] for c in report['crashes']] == declared['crashes']
          assert len(report['late_io']) == len(declared['late_io']) == 7
          assert [c['phase'] for c in report['late_io']] == declared['late_io']
          assert all(c['passed'] is True for c in report['crashes'] + report['late_io'])
          calibration = report['calibration']
          assert calibration['init-adoption']['passed'] is True
          assert calibration['init-adoption']['missing_closure_rejected'] is True
          assert calibration['ordinary-effect']['passed'] is True
          assert calibration['no-op-rejected']['passed'] is False
          print('12 process interruptions / 7 late-I/O faults; separate init, effect and no-op controls verified')
          PY
      - name: Run actual owned-loop clock and lifecycle controls
        run: |
          set -euo pipefail
          docker create --name "$TIMING_CONTAINER" --init --network none --read-only \
            --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 1g --memory-swap 1g --cpus 1 \
            --tmpfs /work:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=128m,mode=1777 \
            headlong-controls python3 /fixture/ego_owned_timing.py
          docker inspect "$TIMING_CONTAINER" > "$RUNNER_TEMP/ego-timing-container.json"
          timeout 600 docker start -a "$TIMING_CONTAINER" > "$RUNNER_TEMP/ego-timing-report.json"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$TIMING_CONTAINER")" = 0
          python3 - "$RUNNER_TEMP/ego-timing-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          assert report['schema'] == 'ego-owned-timing/v1' and report['status'] == 'pass'
          assert report['sources_unchanged'] is True and report['challenge'] is None
          expected = ['timers', 'reactive-3', 'reactive-5', 'reactive-8', 'sigterm-backoff', 'exclusive-writer']
          assert [c['scenario'] for c in report['cases']] == expected
          assert all(c['passed'] is True and c['scopes_closed'] is True for c in report['cases'])
          assert any(c.get('classification') == 'during-backoff' for c in report['cases'])
          assert report['declared_population']['timer_waits'] == [5,10,20,40,40]
          assert len(report['calibration']) == 24 and all(c['rejected'] is True for c in report['calibration'])
          print('Six actual timer wakes, three fixed arrivals, backoff SIGTERM and exclusive writer verified')
          PY
      - name: Remove only this evaluation container
        if: always()
        run: docker rm -f "$CONTROL_CONTAINER" "$NATIVE_CONTAINER" "$REFERENCE_CONTAINER" "$BRIDGE_CONTAINER" "$OWNED_CONTAINER" "$MATRIX_CONTAINER" "$RECOVERY_CONTAINER" "$TIMING_CONTAINER" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: headlong-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/headlong-report.json
            ${{ runner.temp }}/headlong-image.json
            ${{ runner.temp }}/headlong-container.json
            ${{ runner.temp }}/headlong-native-report.json
            ${{ runner.temp }}/headlong-native-container.json
            ${{ runner.temp }}/headlong-reference-report.json
            ${{ runner.temp }}/headlong-reference-container.json
            ${{ runner.temp }}/headlong-bridge-report.json
            ${{ runner.temp }}/headlong-bridge-container.json
            ${{ runner.temp }}/ego-owned-report.json
            ${{ runner.temp }}/ego-owned-container.json
            ${{ runner.temp }}/ego-matrix-report.json
            ${{ runner.temp }}/ego-matrix-container.json
            ${{ runner.temp }}/ego-recovery-report.json
            ${{ runner.temp }}/ego-recovery-container.json
            ${{ runner.temp }}/ego-timing-report.json
            ${{ runner.temp }}/ego-timing-container.json
          retention-days: 7
          if-no-files-found: error
