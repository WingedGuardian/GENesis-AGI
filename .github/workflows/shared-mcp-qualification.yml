name: Shared MCP qualification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - .github/workflows/shared-mcp-qualification.yml
      - .github/shared-mcp/**
      - .github/test-tools/**
      - pyproject.toml
      - src/genesis/**
      - tests/**
      - scripts/**
  push:
    branches: [main]
    paths:
      - .github/workflows/shared-mcp-qualification.yml
      - .github/shared-mcp/**
      - .github/test-tools/**
      - pyproject.toml
      - src/genesis/**
      - tests/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-mcp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  qualify:
    runs-on: ubuntu-latest
    # Project timeout-policy floor; this job has no model/native turns.
    timeout-minutes: 120
    env:
      GENESIS_REQUIRE_SHARED_MCP_QUALIFICATION: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the qualified test environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,transcript-analytics]" -c .github/test-tools/requirements.txt -c .github/shared-mcp/requirements.txt
      - name: Check pure settings and qualification contracts
        run: |
          python -m pytest tests/test_mcp/test_shared_http_settings.py tests/test_mcp/test_shared_service_settings.py tests/test_mcp/test_local_health_selection.py tests/test_mcp/test_shared_qualification_contract.py tests/test_scripts/test_ci_test_tool_pins.py tests/test_mcp/test_shared_notify.py tests/test_scripts/test_shared_mcp_templates.py tests/test_knowledge/test_caller_read_paths.py -q
      - name: Run the real protocol and shared CLI suites
        run: |
          rm -f junit-shared-mcp.xml
          python -m pytest tests/test_mcp/test_shared_http_admission.py tests/test_mcp/test_shared_http_policy.py tests/test_mcp/test_shared_http_runtime.py tests/test_mcp/test_shared_cli_startup_contract.py tests/test_mcp/test_shared_forwarder.py tests/test_mcp/test_shared_forwarder_http_errors.py tests/test_forwarder_credentials.py tests/test_mcp/test_shared_path_policy.py tests/test_mcp/test_shared_paths.py tests/test_mcp/test_shared_path_tools.py tests/test_mcp/test_shared_path_routes.py tests/test_mcp/test_shared_path_versions.py tests/test_mcp/test_shared_path_context.py tests/test_mcp/test_ordinary_preparation.py tests/test_mcp/test_plan_bookmark_consumption.py -q --junitxml=junit-shared-mcp.xml
      - name: Require the complete unskipped protocol population
        run: python scripts/check_skip_ceiling.py junit-shared-mcp.xml --ceiling 0 --min-collected 422
