# Delete a PR's head branch when the PR closes WITHOUT merging.
#
# The merged half is native (`delete_branch_on_merge`); this is the half GitHub
# has no setting for. Without it, every closed-unmerged PR strands its branch on
# the public remote — measured on this repo 2026-09-15: 30 of 104 remote
# branches were exactly that, every one a closed or merged PR's leftover. Under
# squash-merge those leftovers are indistinguishable from unmerged work by any
# ancestry test, so they later get mistaken for pending changes and grow
# duplicate PRs for work that already landed.
#
# Safety properties, each load-bearing:
#   * `pull_request_target` runs THIS file from the default branch and nothing
#     here checks out or executes PR code — every PR-controlled value arrives
#     through `env:` and never through `${{ }}` inside `run:`, so the elevated
#     token is never exposed to PR content.
#   * Same-repo branches only: a fork's head is not ours to delete.
#   * Never the default branch, however a PR came to have it as head.
#   * The ref must still be AT THE CLOSED PR'S HEAD SHA. A name that was deleted
#     and reused since the close event points at unrelated work, and this job has
#     no claim on it.
#   * Skipped when the branch is still the HEAD or the BASE of another open PR
#     (stacked PRs share branches; deleting the base strands the child). The
#     head-side question is asked over GraphQL because it must cross the FORK
#     NETWORK: `GET /repos/{owner}/{repo}/pulls?head=` only returns requests
#     whose BASE repo is this one, so an open request from our branch into a
#     fork is invisible to it. Measured on a ref with exactly one such request:
#     REST answers 0, `Ref.associatedPullRequests` answers 1.
#
# The residual race, stated rather than papered over: the keep-check and the
# deletion are separate requests, so a PR opened onto this branch between them
# is not seen. There is no post-hoc detector for it — GitHub CLOSES a branch's
# open pull requests as part of deleting the branch, so a check running
# afterwards would read state the deletion had already changed and would report
# all-clear precisely when it should not. This is the same race
# `delete_branch_on_merge` already runs, with the same recovery: the closed PR
# offers "Restore branch", and the request is then reopened — two steps, both
# manual, neither lossy. `refs/pull/N/head` is retained regardless, so no commit
# becomes unreachable.
#
# Operator lever: disabling this workflow in the Actions UI turns the behaviour
# off without a code change (Actions → Branch cleanup → Disable workflow).
name: Branch cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-unmerged-head:
    # merged == true is delete_branch_on_merge's job; doing it here too would
    # just race it. This job exists for the closed-without-merge case.
    if: >
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the head branch unless another open PR still uses it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          OWNER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # REQUIRED, not decoration: bash unsets errexit inside every command
          # substitution, so `counts=$(keep_check)` would NOT fail when a `gh`
          # call inside the function failed — the probe would return an empty
          # string and the caller would act on it. Measured on bash 5.2:
          # `set -e; f(){ h=$(false); echo SURVIVED; }; c=$(f)` exits 0 without
          # this line and 1 with it.
          shopt -s inherit_errexit

          # Branch names are attacker-shaped input and legally contain URL
          # metacharacters: `git check-ref-format` bans space, `~ ^ : ? * [ \`
          # and control characters, but ALLOWS `& % # + @ { }` — each of which
          # changes the meaning of a URL. So encode rather than denylist; a
          # denylist is a list of the characters someone thought of, and `+`
          # (decoded as a space in a query string) was the one missing.
          #
          # Used by the ref READ below (the GraphQL leg binds a variable and
          # the deletion goes over the git wire, so neither needs it).
          # Per-SEGMENT encoding, because `refs/heads/a/b` must keep its
          # separators literal while `#` or `%` inside a segment must not.
          # Encoding `{` and `}` is load-bearing too: `gh api` substitutes
          # literal `{owner}`/`{repo}` placeholders in an endpoint path, so a
          # branch named `{repo}` would otherwise be rewritten before the call.
          ENC_BRANCH=$(jq -rn --arg b "$BRANCH" '$b | split("/") | map(@uri) | join("/")')

          # NOTE: `-f`, never `-F`. `gh api -F` treats a leading `@` as a
          # FILENAME, and `@something` is a legal ref name — so `-F` here would
          # turn an attacker-chosen branch name into a file read on the runner.
          keep_check() {
            local heads bases
            # Head side over GraphQL: it crosses the fork network (see the
            # header), and the ref travels as a bound VARIABLE, so this leg
            # needs no URL encoding and is structurally injection-proof.
            #
            # FULLY QUALIFIED (`refs/heads/`), never the bare name: a short
            # name is resolved with git's ambiguity rules, so a branch legally
            # named `heads/topic` — or one colliding with a tag — could resolve
            # to a DIFFERENT ref or to null. Null then becomes 0 via `// 0`,
            # which reads as "no open request uses this branch" and clears the
            # way to delete one that is still in use. Qualifying removes the
            # ambiguity outright.
            # shellcheck disable=SC2016  # $o/$r/$b are GRAPHQL variables and
            # must NOT expand in the shell — that is what makes this leg
            # injection-proof; they are bound by the -f flags below.
            heads=$(gh api graphql -f query='
              query($o:String!,$r:String!,$b:String!){
                repository(owner:$o,name:$r){
                  ref(qualifiedName:$b){
                    associatedPullRequests(states:OPEN,first:1){ totalCount } } } }' \
              -f o="$OWNER" -f r="${REPO#*/}" -f b="refs/heads/$BRANCH" \
              --jq '.data.repository.ref.associatedPullRequests.totalCount // 0')
            # Base side stays REST: a pull request's BASE ref always lives in
            # the base repository, so this filter is complete by construction.
            bases=$(gh api --method GET "repos/$REPO/pulls" \
              -f state=open -f "base=$BRANCH" --jq 'length')
            echo "$heads $bases"
          }

          # The ref must still exist AND still point at the closed PR's tip. A
          # missing ref is an ordinary outcome (manual deletion, an earlier run);
          # a ref at a different SHA means the name was reused since the close
          # event and now carries work this job has no claim on. Anything else —
          # auth, rate limit, a network fault — must NOT be read as "already
          # gone", which is what a bare `if gh api …` did: `gh` exits 1 for every
          # failure, so operational errors were indistinguishable from the
          # expected 404 and the run stayed green with nothing to retry.
          if ! ref_json=$(gh api "repos/$REPO/git/ref/heads/$ENC_BRANCH" 2>"$RUNNER_TEMP/ref_err"); then
            # Anchored to the whole status line: 401/403/5xx and connection
            # errors carry no such line and propagate. A 404 can also mean the
            # repo is invisible to this token, which would make the job do
            # NOTHING — a bounded, non-destructive outcome, and the reason this
            # leg exits 0 rather than deleting anything.
            if grep -qE '^gh: .*\(HTTP 404\)$' "$RUNNER_TEMP/ref_err"; then
              echo "note: $BRANCH no longer exists — nothing to do"
              exit 0
            fi
            echo "ERROR: could not read $BRANCH:" >&2
            cat "$RUNNER_TEMP/ref_err" >&2
            exit 1
          fi
          current_sha=$(jq -r '.object.sha' <<<"$ref_json")
          if [ "$current_sha" != "$HEAD_SHA" ]; then
            echo "keep: $BRANCH is at $current_sha, not the closed PR's head $HEAD_SHA"
            echo "      (the name was reused since the close event; not ours to delete)"
            exit 0
          fi

          counts=$(keep_check)
          read -r open_heads open_bases <<<"$counts"
          if [ "$open_heads" != "0" ] || [ "$open_bases" != "0" ]; then
            echo "keep: $BRANCH is still used by an open PR (heads=$open_heads bases=$open_bases)"
            exit 0
          fi

          # ATOMIC DELETE. The SHA was read several API calls ago, and the REST
          # ref-deletion endpoint offers no expected-value precondition — so an
          # unconditional DELETE removes whatever the branch points at NOW,
          # including a commit pushed in between. Git's own wire protocol does
          # have the precondition: `--force-with-lease=<ref>:<expect>` refuses
          # the update unless the remote ref still equals <expect>, and that
          # applies to a DELETION refspec too.
          #
          # MEASURED, both directions: with a stale expectation the remote
          # answers `! [rejected] (delete) -> topic (stale info)` and the branch
          # survives; with the current one it answers `- [deleted] topic`.
          #
          # The push runs from an EMPTY BARE repo — a deletion carries no
          # objects, so nothing is fetched and no PR content is ever checked out
          # or executed. The `pull_request_target` posture is unchanged.
          #
          # The credential goes through GIT_CONFIG_* environment variables
          # rather than argv or a URL, so it is not visible in the process table
          # and cannot be echoed back by a failing push.
          git init -q --bare "$RUNNER_TEMP/delete.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          if ! git -C "$RUNNER_TEMP/delete.git" push \
                 --force-with-lease="refs/heads/$BRANCH:$current_sha" \
                 "https://github.com/$REPO" ":refs/heads/$BRANCH"; then
            echo "keep: $BRANCH moved after the check — deletion refused by the lease" >&2
            echo "      (this is the guard working, not a failure to clean up)" >&2
            exit 0
          fi
          echo "deleted: $BRANCH at $current_sha (restorable from the PR's Restore button)"
