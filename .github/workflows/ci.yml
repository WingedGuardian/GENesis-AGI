name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly Mon 06:00 UTC — surface new CVEs even without repo activity

# One in-flight CI run per branch: a new push cancels the superseded run so it
# stops holding runner slots. Many active branches fanning out full CI with no
# cancellation was saturating the shared runner budget (queue starvation). Never
# cancel main's post-merge run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        # PINNED. `lint` is a required status check with no bypass actor, so a
        # new default rule in an unpinned release turns it red on a diff that
        # touched nothing and blocks every merge in the repository — recoverable
        # only by disabling the ruleset in the UI. See .github/rulesets/README.md.
        # Pinned to the version this repo is developed against locally.
        run: pip install 'ruff==0.15.10'
      - name: Lint
        run: ruff check src/ tests/ scripts/

  dependency-audit:
    # REPORTS known-vulnerable dependencies in the resolved runtime tree. It no
    # longer FAILS — see the step-level continue-on-error below, which is the whole
    # point of this job's current shape.
    #
    # It used to be a blocking check whose red run was "a SIGNAL to bump the dep
    # or add a triaged ignore". In practice the signal arrived as a repo-wide
    # outage: pip-audit queries a LIVE advisory database, so an unchanged
    # dependency tree passes at one hour and fails the next, on every open PR at
    # once, with nobody having changed a line. MEASURED 2026-09-10/11: main's CI
    # passed this job at 18:41 EDT; by 23:30 the same tree failed it on four
    # different branches simultaneously. The four new IDs were litellm
    # CVE-2026-12771/12772/12773/12795, every one of them in `litellm/proxy/` —
    # the same proxy-server class as the litellm IDs triaged at the time (since
    # removed: the 1.93.2 pin is not affected by any of them), and Genesis
    # imports acompletion / completion_cost / model_cost / the exception types
    # and references the proxy NOWHERE (verified across src/, scripts/, config/
    # and pyproject.toml).
    #
    # So the blocking behaviour was not catching reachable vulnerabilities; it
    # was converting third-party disclosure timing into an unplanned freeze of
    # everyone's queue, repaired each time by appending another ignore. The
    # advisories are still printed in the log, and GitHub's Dependabot security
    # alerts — enabled on this repo — remain the mechanism that actually raises a
    # vulnerability to a human. This job is the convenience view of the same
    # data, and a convenience view must not hold the merge queue.
    #
    # NOTE the triaged --ignore-vuln list below is deliberately KEPT rather than
    # deleted. It is the written record of which advisories were examined and why
    # they were judged unreachable; deleting it would discard that reasoning.
    # This reporting-policy change adds no new ignores: the four IDs discussed
    # above remain visible, along with any other ID outside the existing baseline.
    # An ID is removed only when the pinned version is no longer affected by it
    # (git history keeps the reasoning).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime deps + pip-audit
        run: |
          python -m pip install --upgrade pip
          # [browser] too: every install gets it (scripts/bootstrap.sh, install.sh),
          # so camoufox, playwright and patchright are runtime deps that need
          # auditing. Python wheels only; no browser binaries download here.
          pip install -e ".[browser]"
          pip install pip-audit
      - name: Audit dependencies for known CVEs
        # STEP level, not job level, and the difference is the whole mechanism.
        # MEASURED on this PR's own first run: with `continue-on-error` on the
        # JOB, the workflow no longer fails but the job's own check-run
        # conclusion is still `failure`, so `gh pr checks` and the merge gate
        # both still read it red — the block was unchanged. On the STEP, a
        # failing pip-audit does not fail the job, so the rollup entry is green
        # and the advisories are still printed in the log above it.
        continue-on-error: true
        run: |
          # Triaged --ignore-vuln IDs (rationale of record: pyproject.toml pins).
          # A NEW / untriaged advisory is NOT in this list, so it is REPORTED here —
          # it no longer fails the job (see continue-on-error above). Existing
          # ignores reduce log noise; all IDs outside that baseline stay visible.
          #   litellm — no ignores. The 1.93.2 pin has no known advisories
          #     (pip-audit, 2026-10-13). The twelve litellm IDs this list carried
          #     for the old 1.78.7 pin (all proxy-server surface Genesis never runs)
          #     are fixed by 1.93.2 and were removed with the bump; see git history.
          #   diskcache 5.6.3 (CVE-2025-69872) — pickle-by-default RCE, no fixed
          #     release. Genesis's only diskcache use (memory/embeddings.py) is a
          #     JSON-only _SafeDisk subclass, so the vulnerable pickle path is unused.
          #   fastmcp 2.14.7 (PYSEC-2026-2475/CVE-2025-64340, PYSEC-2026-2476/
          #     CVE-2026-27124) — both fixed in 3.2.0, but the pin is deliberately
          #     <3.0 (3.x breaks the API) and NEITHER path is reachable here:
          #     2475 is a Windows-only command injection via `fastmcp install`
          #     (advisory: "Does not affect macOS/Linux") — Genesis runs on Linux
          #     and never calls `fastmcp install` (servers are instantiated
          #     directly and run over stdio). 2476 is a confused-deputy specific
          #     to FastMCP's OAuthProxy + GitHubProvider OAuth flow — Genesis uses
          #     NO OAuthProxy/GitHubProvider/OAuth anywhere (grep-verified). Its
          #     optional streamable-http transport (scripts/genesis_mcp_server.py)
          #     is static Bearer-token auth (GENESIS_MCP_HTTP_TOKEN), not the
          #     vulnerable OAuth flow. Revisit if Genesis ever adopts FastMCP
          #     OAuthProxy/OAuth auth, or a Windows `fastmcp install` path.
          pip-audit \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln PYSEC-2026-2475 \
            --ignore-vuln PYSEC-2026-2476

  leak-detector:
    # Verify no user-specific content (IPs, timezones, personal paths, secrets)
    # leaked into the codebase. Blocking — PRs must pass this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the private-pattern exact scan can diff the PR/push
          # against its base (added lines only — pre-existing legit content like
          # /home/<user> in provisioning scripts is never re-flagged).
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every step body lives in scripts/ci/leak_scan.sh, shared with
      # .github/workflows/branch-leak-scan.yml (every non-main branch push), so
      # the two cannot drift. Pins, checksums and --redact live there. Keep
      # this job's id `leak-detector`: it is a required status check
      # (.github/rulesets/checks.json) and the merge gate's leaks relief is
      # pinned to the (leak-detector, CI) pair.
      - name: Install tools
        run: bash scripts/ci/leak_scan.sh install

      - name: Secret scan (detect-secrets)
        run: bash scripts/ci/leak_scan.sh detect-secrets

      - name: Leak scan (gitleaks)
        # Blocking, whole tree, version+checksum pinned, --redact mandatory.
        run: bash scripts/ci/leak_scan.sh gitleaks

      - name: Class scan (advisory — non-gating)
        run: bash scripts/ci/leak_scan.sh class

      - name: Email scan
        run: bash scripts/ci/leak_scan.sh email

      - name: Binary/data artifact scan
        run: bash scripts/ci/leak_scan.sh binary

      - name: Private-pattern exact scan (hard gate)
        # The REAL install identifiers (private repo/host names, subnets,
        # hardware, tokens) come from the GENESIS_PRIVATE_PATTERNS repo secret —
        # ZERO such values are tracked in this repo. Scans the PR/push ADDED
        # lines + PR body (NOT the whole tree: pre-existing legit content such as
        # /home/<user> in provisioning scripts must not be re-flagged). Never
        # echoes matched content — counts only. Hard-fails on the canonical repo
        # for non-fork PRs and pushes; SKIPS on forks / other installs (no secret,
        # and they cannot know these values — the class scan above is their floor).
        # Secrets are NOT readable in `if:`, so the empty check is done in-script
        # after env-mapping; an `if:` keyed on secrets.* would be silently empty
        # (never runs = false green).
        # Skip Dependabot too: its PRs are same-repo (non-fork) so they'd enter
        # this step, but Dependabot-triggered workflows receive Dependabot
        # secrets, not ordinary Actions secrets, so GENESIS_PRIVATE_PATTERNS is
        # empty and the fail-loud check would break every dependency-bump PR.
        # Dependency bumps never introduce install identifiers; the class-warn
        # scan remains their floor.
        # Range selection (for a pull_request: merge-base with live main, NOT
        # the stale pull_request.base.sha) is in scripts/ci/leak_scan_added_lines.py.
        if: >-
          github.repository == 'WingedGuardian/GENesis-AGI' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.fork == false)
        env:
          PRIV: ${{ secrets.GENESIS_PRIVATE_PATTERNS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/leak_scan.sh private

  migration-check:
    # Migration ids, three rules: every file in a migrations directory is a
    # legal migration (the residue is a violation, because a name that matches
    # nothing is discovered by nothing and NEVER RUNS), no duplicate id in
    # either namespace, and every frozen legacy file is still present under its
    # own name (deleting or renaming one leaves the id set identical while
    # existing installs skip the replacement forever).
    #
    # The legacy namespace is frozen as an ENUMERATED set, not a range: 0092
    # lies between the endpoints and does not exist, so a range check admitted
    # a brand-new hand-allocated 0092_*.py. New migrations use a UTC timestamp,
    # which nobody has to allocate and two branches therefore cannot both claim.
    #
    # The check moved out of shell deliberately. The old glob+grep restated the
    # runners' filename semantics in a second language and could not survive
    # mixed-width ids in EITHER direction (both measured 2026-09-03): its
    # 4-digit glob made timestamp migrations invisible to the guard, and
    # widening the glob while keeping `grep -oP '^\d{4}'` truncated every
    # 20260903… id to "2026", reporting two distinct migrations as duplicates.
    # scripts/check_migration_prefixes.py imports the runners' own patterns, so
    # the guard cannot drift from what actually runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The immutability rule asks git what was ALREADY MERGED — the one
          # question a list in the repo cannot answer for an unbounded id space.
          # A shallow clone has no base commit to compare against, and the guard
          # treats an unreadable --base as a violation rather than a pass.
          fetch-depth: 0
      - name: Check migration ids (uniqueness + immutability)
        env:
          # Passed via env, not interpolated into `run` — same handling the
          # leak-detector job uses for PR_BASE_SHA.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # For `push: main` builds. origin/main is USELESS there — it IS the
          # just-pushed checkout, so `--base origin/main` compares the tree with
          # itself and the immutability rule silently checks nothing. The push
          # event's `before` SHA is the pre-push state, which is the base that
          # makes the post-merge run able to see a deletion that reached main
          # outside the PR check. All-zero on branch creation, hence the guards
          # below.
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Base resolution, most-specific first:
          #   PR build        -> the PR base (what "already merged" means there);
          #   push build      -> the pre-push SHA (see PUSH_BEFORE_SHA above);
          #   schedule/manual -> origin/main IF it differs from the checkout.
          # `--base` is passed only when a ref was resolved, exists, AND is not
          # the checkout itself. A base equal to HEAD is a self-comparison: the
          # rule would examine nothing while the log claimed "immutable against
          # origin/main" — a verified-grammar claim that is false, and the exact
          # silent pass the guard's own doctrine forbids. So schedule/dispatch
          # runs on main (and any degraded push case whose `before` is
          # unreachable) drop --base and honestly print best-effort scope; the
          # PR and push runs are the enforcement points for immutability.
          # Known fail-NOISY edge, accepted: a re-run of an OLD build compares
          # its old checkout against origin/main fetched NOW and can go red on
          # migrations that merged since — loud and explainable, never silent.
          base="${PR_BASE_SHA:-}"
          if [[ -z "$base" && -n "${PUSH_BEFORE_SHA:-}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] \
             && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base" ]] && git rev-parse --verify -q origin/main >/dev/null \
             && [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]]; then
            base="origin/main"
          fi
          if [[ -n "$base" ]]; then
            python3 scripts/check_migration_prefixes.py --base "$base"
          else
            python3 scripts/check_migration_prefixes.py
          fi

  changelog-fragments:
    # Every file in changelog.d/ is a legal fragment — the residue is a
    # violation, for the same reason the migration-id check treats it that way:
    # a fragment nobody recognises is a changelog entry that never ships, and
    # nothing notices, because the release section still looks complete.
    #
    # Validated on every PR rather than at release, because collect_fragments is
    # all-or-nothing: one malformed fragment from any merged PR blocks assembly
    # of EVERY fragment, and discovering that on release day means discovering
    # it from the wrong person at the wrong time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # --base asks git what the base branch ALREADY has, which is the one
          # question the checked-out tree cannot answer. A shallow clone has no
          # base commit, and the check treats an unreadable base as a violation
          # rather than a pass.
          fetch-depth: 0
          # This job only READS the tree, so it has no use for a credential
          # left behind in .git/config where every later step can reach it.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate changelog.d fragments
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # For `push: main` builds. origin/main is useless there — it IS the
          # just-pushed checkout — but the push event's `before` SHA is the
          # pre-push state, which is what lets the post-merge run see a fragment
          # that vanished outside the PR check (a direct push, an admin merge, a
          # PR whose base was unreadable). Same resolution the migration-id job
          # uses, for the same reason. All-zero on branch creation.
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-}"
          if [ -z "$base" ] && [ -n "${PUSH_BEFORE_SHA:-}" ] \
             && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          fi
          if [ -n "$base" ]; then
            # Deliberately NOT guarded by `git cat-file`: the deletion rule fails
            # CLOSED on a base it cannot read, and swallowing that here would
            # turn its refusal into a silent pass — the one outcome its own
            # docstring says must never happen.
            python scripts/assemble_changelog.py --check --base "$base"
          else
            # schedule/dispatch only. Say what is NOT being enforced rather than
            # reporting a green that covers less than it appears to.
            echo "note: no base ref on this event; the deletion rule is not enforced"
            python scripts/assemble_changelog.py --check
          fi

  external-io-check:
    # WS5 regression guard: no NEW ungated autonomous external-world egress
    # (Discord REST/webhook, public social APIs) outside the reasoned allowlist.
    # See scripts/check_external_io.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: External-I/O egress guard
        run: python scripts/check_external_io.py

  atomic-write-check:
    # An atomic write that orphans its temp on the exception path leaks a file
    # into a directory nothing sweeps. MEASURED 2026-10-10: 73 sites, 30 dirty --
    # and a 0-byte temp had sat in ~/.genesis for 3.5 months, a root no reaper
    # covers. ALLOWLIST polarity against a shrinking debt ledger, so instance 31
    # cannot arrive silently FROM A NEW FUNCTION while the existing 30 are fixed
    # -- a second unprotected write inside an already-baselined function, with
    # the same temp name, collides with that row and passes. The guard docstring
    # states that exception; this comment used to assert the claim unqualified.
    # See scripts/check_atomic_writes.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # This job only READS sources. Persisted credentials stay
          # available to every later step in the job for no benefit.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Atomic-write temp-file guard
        run: python scripts/check_atomic_writes.py

  frozen-clock-check:
    # A test that captures a wall clock at IMPORT time gives the whole suite's
    # runtime to burn its safety margin, then fails on slow runners as an
    # unreproducible "flake". Measured instance: a 25-minute margin that passed
    # at 16m into a run and failed at 27m (~3% of runs). Runs as its own fast
    # job so the finding reads as a lint error in seconds rather than surfacing
    # 16 minutes into the suite. Escape hatch is
    # '# frozen-clock-ok: <why, with the measured margin>'.
    # See scripts/check_frozen_clock.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Frozen-clock guard
        run: python scripts/check_frozen_clock.py

  subsystem-map-check:
    # Judgment-layer map guard: docs/architecture/CURRENT.md must claim every
    # top-level src/genesis module (an unmapped or vanished module = the map
    # lies to audits → error). Stale 'verified:' stamps only warn. The stamp
    # check counts commits since each entry's stamp, so this job alone checks
    # out full history (fetch-depth: 0); the checker degrades gracefully on
    # shallow clones. See scripts/check_subsystem_map.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install checker dependency
        run: pip install pyyaml
      - name: Subsystem-map drift guard
        run: python scripts/check_subsystem_map.py

  shared-artifact-consumer-check:
    # Shared-artifact registry guard: docs/architecture/shared-artifacts.md must
    # declare every code consumer of each registered artifact — a NEW consumer a
    # documenting file never learned about is a doc that lies → error. The reader
    # diff is a fixed-string content scan of src/ + scripts/, so no git history is
    # needed (no fetch-depth: 0). See scripts/check_shared_artifact_consumers.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install checker dependency
        run: pip install pyyaml
      - name: Shared-artifact consumer drift guard
        run: python scripts/check_shared_artifact_consumers.py

  hook-versions-check:
    # Completeness backstop for .genesis-hook-versions: every version of a
    # tracked git hook that ever shipped on main must be recorded, or a
    # community install still carrying it gets wedged (sync-hooks.sh treats an
    # unrecorded hash as "user-modified" and never updates it). The checker
    # walks FULL hook history, so this job checks out fetch-depth: 0; it skips
    # gracefully on a shallow clone. See scripts/check_hook_versions_complete.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Hook-version ledger completeness guard
        run: bash scripts/check_hook_versions_complete.sh

  cc-node-lockstep:
    # Enforce the CC↔Node pin lockstep: NODE_MAJOR in scripts/lib/cc_version.sh
    # must satisfy the pinned Claude Code's engines.node floor. Prevents the
    # "bumped CC past a Node floor, forgot NODE_MAJOR" mistake that left a host
    # unable to run `claude -p`. Fails closed on a real mismatch / typo'd pin;
    # fails open (warn) on a transient npm-registry error. See
    # scripts/check_cc_node_lockstep.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: CC↔Node pin-lockstep guard
        run: python scripts/check_cc_node_lockstep.py

  review-depth-check:
    # Advisory review-DEPTH visibility: recompute substantiality on the PR range
    # (base...HEAD, so it needs full history — fetch-depth: 0) and emit a LOUD
    # ::warning:: annotation when the change is substantial, so the human reviewer
    # + the independent cloud reviewer apply an adversarial /review-level audit
    # rather than a lean pass. Advisory BY DESIGN (exit 0 always): a committed audit
    # artifact is forgeable and the local hook is editable by the same author, so
    # the enforcing teeth are the independent reviewer + a required human approval
    # (branch protection), not this check. Stdlib-only. See scripts/check_review_depth.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Review-depth advisory
        env:
          # Event base SHA (trusted-format) — robust vs origin/* ref materialization,
          # matching the leak-detector job. Passed via env (not interpolated into run).
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_review_depth.py

  cc-pin-receipts:
    # Advisory early warning that a pin bump is missing its gate receipts (the
    # full changelog read, and the local-first soak — docs/reference/
    # cc-compatibility.md §Updating). Advisory BY DESIGN (exit 0 always), for a
    # reason specific to this check rather than inherited from the job above: it
    # reads the PR BODY, which stays mutable after a run completes. A completed
    # check run is immutable and the merge gate treats a stale FAILURE as red on
    # purpose (PR #1424 — the gate forces `--admin`, so letting a later SUCCESS
    # clear an earlier FAILURE would make re-running a job until green enough to
    # merge). A BLOCKING status over a mutable input therefore could not be
    # cleared by fixing the input; the author would have to push a commit to get
    # a fresh head. The enforcing teeth are the merge gate, which re-reads the
    # body at merge time from main's copy of the checker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base needs history on both sides.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: CC pin-receipt advisory
        env:
          # Attacker-controlled text: passed via env, NEVER interpolated into
          # `run`. Same handling the leak-detector job uses for PR_BASE_SHA.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # merge-base, NOT HEAD^1: parent count is not a reliable "this is the
          # merge ref" signal, and scripts/ci/leak_scan_added_lines.py rejects
          # that inference for the same reason.
          #
          # BOTH commands are guarded. Under `set -e` an unresolvable origin/main
          # (or no common ancestor) would kill the step and turn this job RED —
          # in a job whose entire justification is that it cannot fail. An empty
          # base is handled by the checker itself: advisory mode reports "no base
          # SHA to compare against" and exits 0.
          git fetch --no-tags --quiet origin main || true
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          python scripts/check_cc_pin_receipts.py --advisory --base-sha "$base"

  test:
    runs-on: ubuntu-latest
    # CI is blocking — local full-suite runs are banned. See procedure
    # test_verification and CLAUDE.md "Targeted tests during development."
    #
    # This job had NO timeout-minutes, so it inherited GitHub's 360-minute
    # default. Two runs in this workflow have hit ~5.7h (33991793671,
    # 33991913763, both failed) — consistent with that default killing them.
    # WHICH job wedged is no longer recoverable (the per-job API returns an
    # empty list for both now), so this cap is not attributed to `test`; it
    # bounds `test` because that is the long job, not because it was proven
    # guilty. The sibling jobs all still inherit 360.
    #
    # Derived, not guessed — MEASURED 2026-09-06 over the last 23 successful
    # main runs, per JOB (`gh api .../runs/<id>/jobs`, name == "test"), NOT the
    # workflow-run duration, which is ~20 min longer because it includes 12
    # sibling jobs and queue time: min 19m38s, p50 29m22s, max 31m15s.
    # The ceiling must exceed the worst LEGITIMATE case — that max plus one
    # full per-test kill (pyproject `timeout = 3600`) = ~91 min — or this job
    # would pre-empt the per-test timeout and make it dead code. 180 leaves
    # ~89 min of growth headroom and still halves the default.
    # Revisit as the suite grows — the --durations output below is the data.
    timeout-minutes: 180
    # fetch-depth: 0 because measurement tests derive a rate from this
    # repository's own commit history and SKIP on a shallow clone rather than
    # lie. A skipped gate is an unevaluated gate: the commit-msg framing
    # advisory asserts a 0.1% fire-rate bar over real subjects, and under the
    # default depth-1 checkout that assertion never ran at all, so a later
    # pattern change with a bad rate would have passed CI (Codex P2, PR #1623).
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        # The narrator below fires on THIS step's failure, not on the job's.
        id: tests
        run: |
          # Never measure a stale report: if pytest dies before writing
          # one, the checker must find nothing rather than yesterday's.
          rm -f junit.xml
          # Ignore preserved AZ-era test files that import removed modules
          #
          # --durations: this suite's per-test cost has NEVER been measured.
          # No --durations anywhere, no registered markers, and the sole
          # pytest.mark.slow is an unregistered no-op whose own docstring
          # claims those tests are "skipped in normal CI runs" — CI passes no
          # -m "not slow", so they run. Every timeout in this repo has
          # therefore been a guess. Print the 25 slowest so the next person
          # inherits a number instead of one.
          #
          # NO -v, and that is a diagnosability decision, not tidiness.
          # MEASURED 2026-09-14 (run 34898229755): -v printed one line per
          # test across 26,074 tests, GitHub's log APIs truncated the step at
          # ~44% of the suite — and pytest prints its FAILURES block at the
          # TAIL, so a red run named no failing test through --log,
          # --log-failed, the whole-run log or the raw endpoint. -rfE keeps a
          # compact list in the summary; the failure-summary step below
          # carries the names somewhere truncation cannot reach at all.
          #
          # -rfE, not -rf: E is ERRORS, which are a DIFFERENT outcome from
          # failures, not a louder one. A fixture that raises or a module
          # that fails to import is reported as an error and appears in
          # NEITHER the -rf list nor the FAILURES block, so -rf alone leaves
          # the collection-time breakages -- the ones hardest to read off a
          # truncated log -- named nowhere.
          # Falsifier for a claim this workflow's dormancy guard rests on:
          # the fleet-door behavioural test needs a TERM to attach a tmux
          # client, and is believed to have skipped on CI because runners set
          # none. That was INFERRED, never measured -- the per-step `env:`
          # echo above is what the step DECLARES, not the process
          # environment (PATH and HOME are absent from it too). One line
          # settles it in the log instead of leaving the next reader to
          # re-derive it.
          echo "TERM=[${TERM-UNSET}]"
          pytest -rfE --durations=25 \
            --ignore-glob='**/test_*az*.py' \
            --ignore-glob='**/test_*shim*.py' \
            --ignore=tests/test_ui/ \
            --junit-xml=junit.xml
        env:
          GENESIS_TESTING: "1"
          # The breadcrumb the conftest rewrites before every test and fsyncs.
          # It is the ONLY channel that survives a hard crash inside a test --
          # no report is written and, without -v, the log names nothing either.
          GENESIS_ACTIVE_TEST_FILE: active-test.txt
      # The step log's tail is where pytest names the failures, and the tail
      # is what GitHub's log cap drops (measurement above). The step summary
      # is rendered by the Actions UI OUTSIDE the log, so it survives however
      # long the suite grows. failure() rather than !cancelled(): on green
      # there is nothing to narrate, and the script's own notice covers the
      # report-never-written case (pytest died in collection) rather than
      # letting a missing file read as a second failure.
      #
      # AND scoped to the TEST step, because a job-wide condition is true after
      # ANY earlier step fails. Checkout, setup-python and the dependency
      # install all precede this one: unscoped, a broken install makes this say
      # "pytest died before writing a report" about a pytest that never ran,
      # and a broken CHECKOUT leaves no script and no interpreter, so the
      # narrator itself goes red -- a second failure invented by the step whose
      # entire contract is never to add one. A skipped test step reads
      # 'skipped', so every pre-pytest failure is silent.
      #
      # !cancelled() rather than failure(), and the reason is not style. An
      # `if` containing NO status-check function gets an implicit success()
      # AND-ed onto it, so the outcome test ALONE would never run after a
      # failure -- the condition has to carry one. failure() would work today
      # but is the wrong one to carry: it is false when a step is marked
      # continue-on-error, so adding that to the test step later would silently
      # take this narrator offline while `outcome` still read 'failure'.
      # !cancelled() survives that, and matches the two sibling steps below.
      #
      # `outcome`, not `conclusion`, for the same reason: outcome is the raw
      # result before continue-on-error rewrites it.
      - name: Name the failures where truncation cannot reach
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        run: python scripts/ci/failure_summary.py junit.xml >> "$GITHUB_STEP_SUMMARY"
        env:
          GENESIS_ACTIVE_TEST_FILE: active-test.txt
      # The junit report holds every traceback in full and was previously
      # DISCARDED with the runner — the dormancy guard parsed it, then it
      # died with the VM while the truncated log held ~44% of the run.
      # !cancelled() matches the dormancy guard's reasoning below: always()
      # would also fire on a re-push cancellation and archive a half-written
      # report as though it described a finished run.
      - name: Preserve the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-report
          path: junit.xml
          # pytest can die before writing any report (collection crash); the
          # failure-summary step already names that case in the summary, so a
          # missing file here is information, not an upload error.
          if-no-files-found: ignore
          retention-days: 14
      # A test that stops running is invisible: it makes the suite SMALLER,
      # not red. Two axes, because dormancy moves both ways: a broken skipif
      # RAISES the skip count, while a lost marker or a dropped directory
      # LOWERS the collected count. This step guards the SKIP axis. The
      # collected axis is the `collected-floor` job below, which compares the
      # collected test ids against the commit the change lands on, so no
      # hand-maintained number sits on this line any more (#2743).
      - name: Suite dormancy guard
        # NOT always(): that also fires on cancellation, and this workflow
        # sets cancel-in-progress for every non-main ref — so a re-push
        # would kill pytest mid-suite, leave no report, and the step would
        # refuse with a cause that is not the cause.
        if: ${{ !cancelled() }}
        # The CEILING is the skip+xfail count measured on these runners. Raise
        # it only in the commit that adds the skip, and count on the RUNNER from
        # the junit report, never on a dev box: which optional tools are
        # installed differs, so a local "N skipped" is the wrong denominator.
        # Each raise was counted, not padded:
        #   95   baseline, measured on the PR that shipped this guard (job
        #        101515129147, head bbd11ad1).
        #   99   FalkorDB store: four engine-gated tests skip wherever no
        #        engine is provisioned, CI included.
        #   102  wrapper-arity lock: three parametrisations skip because `doas`
        #        and `uvx` are absent from the runner (and `time` is excluded,
        #        a bash keyword), found by diffing the skip SETS of two junit
        #        reports (main 8a465c7b1 against that branch).
        #   104  branch leak scan (#2880): two workflow tests call ripgrep,
        #        which this job does not install (the run at 3b14708f1
        #        skipped 104).
        #   124  native codex harness (#3075): test_codex_native.py's 20 cases
        #        carry a module-wide skipif on GENESIS_CODEX_NATIVE_TESTS,
        #        which CI never sets (native binaries are a separate opt-in).
        # Before raising it to green, read each new skip's own message:
        # raising the ceiling can CERTIFY a dormant test, and the ceiling
        # cannot say which test skipped. The behavioural fleet-door and
        # slot-door tests attach a real tmux client and take a RUNTIME skip
        # if that fails, so read those first when the count rises.
        # The collected-count floor that shared this line until #2743, and its
        # ledger of hand counts, are in this file's git history.
        # Hook-output property tests (#3187): four strict xfails, ceiling 124 -> 128.
        # Codex budget native tests (test_codex_budget_native.py): 28 opt-in cases
        # skipped unless GENESIS_CODEX_NATIVE_TESTS=1, ceiling 128 -> 156.
        run: python scripts/check_skip_ceiling.py junit.xml --ceiling 156

  collected-floor:
    # Tests that stop being collected make the suite SMALLER, not red. This job
    # collects test ids twice in the same workspace, the PR tree and then the
    # commit it lands on, and fails when ids vanish from files the change did
    # not touch, unless the PR body has a line `Collected-drop: <reason>`. The
    # rule, its exit codes and the measurements behind it are in
    # scripts/ci/collected_floor.py. It replaced the hand-maintained
    # --min-collected number every test-adding PR edited (#2743).
    #
    # SAME PATH on purpose: three parametrize ids embed the checkout's absolute
    # root, so collecting the base in a second directory flags them on every PR.
    #
    # The escape line is read from a MUTABLE body, so after adding it the author
    # re-runs this job. That clears the red only while the merge gate reads a
    # re-run's latest attempt; if #2624 changes that, the remedy becomes a push.
    #
    # pull_request and push only: a scheduled or manual run has no change to judge.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Resolve the base commit
        id: base
        env:
          # Passed via env, not interpolated into `run`.
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # The checkout is GitHub's merge commit: parent 1 is the base tip,
            # parent 2 the PR head (measured on refs/pull/3134/merge).
            words="$(git rev-list --parents -n 1 HEAD | wc -w)"
            if [[ "$words" != 3 ]]; then
              echo "::error::collected-floor: expected a 2-parent merge commit, got $((words - 1)) parent(s)"
              exit 2
            fi
            base="$(git rev-parse 'HEAD^1')"
          else
            # A push to main: the pre-push tip, guarded as migration-check does.
            if [[ -z "${PUSH_BEFORE_SHA:-}" || "$PUSH_BEFORE_SHA" == "0000000000000000000000000000000000000000" ]] \
               || ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::collected-floor: the push's previous tip '${PUSH_BEFORE_SHA:-}' is not a readable commit"
              exit 2
            fi
            base="$PUSH_BEFORE_SHA"
          fi
          echo "collected-floor: base $base, head $head"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Collect test ids on both trees
        env:
          GENESIS_TESTING: "1"
          BASE: ${{ steps.base.outputs.base }}
          HEAD_SHA: ${{ steps.base.outputs.head }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/collected-floor"
          mkdir -p "$out"
          # The plugin must stay importable while the base is checked out.
          cp scripts/ci/collect_ids_plugin.py "$RUNNER_TEMP/"
          # -z: a non-ASCII path is otherwise C-quoted and matches no node id.
          git diff -z --no-renames --name-only "$BASE" "$HEAD_SHA" > "$out/changed.txt"
          collect() {
            local rc=0
            # The test job's three selection flags; tests/test_scripts/
            # test_collected_floor.py fails if the two lists drift apart.
            COLLECTED_FLOOR_OUT="$out/$1.json" PYTHONPATH="$RUNNER_TEMP" \
              "$2" -m pytest --collect-only -q -p collect_ids_plugin --continue-on-collection-errors \
              --ignore-glob='**/test_*az*.py' \
              --ignore-glob='**/test_*shim*.py' \
              --ignore=tests/test_ui/ > "$out/$1.log" 2>&1 || rc=$?
            # 0 clean, 1 collection errors (the comparison judges them), 5 no
            # tests (the comparison refuses an empty tree). Anything else is
            # pytest itself failing.
            if [[ "$rc" != 0 && "$rc" != 1 && "$rc" != 5 ]]; then
              tail -n 50 "$out/$1.log"
              echo "::error::collected-floor: pytest exited $rc collecting the $1 tree"
              exit 2
            fi
            tail -n 1 "$out/$1.log"
          }
          collect pr python
          # The base must collect under ITS OWN dependencies: under the PR's,
          # a test the PR drops by removing or capping a dependency would skip
          # on both trees and never show as vanished. pyproject.toml is the
          # only dependency declaration, so when it differs between the trees
          # the base gets a fresh venv (nothing the PR installed can leak in);
          # when it does not, the installed environment is already the base's.
          # A failed diff counts as "differs", the safe direction.
          base_py=python
          deps_differ=0
          git diff --quiet "$BASE" "$HEAD_SHA" -- pyproject.toml || deps_differ=1
          # --force: an untracked file in the way of a base file would
          # otherwise stop the switch (measured, git 2.43).
          git checkout --quiet --force --detach "$BASE"
          if [[ "$deps_differ" == 1 ]]; then
            echo "collected-floor: pyproject.toml differs; collecting the base in a fresh venv"
            python -m venv "$RUNNER_TEMP/venv-base"
            base_py="$RUNNER_TEMP/venv-base/bin/python"
            "$base_py" -m pip install --quiet -e ".[test]" > "$out/base-install.log" 2>&1 \
              || { tail -n 30 "$out/base-install.log"; echo "::error::collected-floor: installing the base tree's dependencies failed"; exit 2; }
          fi
          collect base "$base_py"
          git checkout --quiet --force --detach "$HEAD_SHA"
      - name: Read the PR body for a Collected-drop line
        id: body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/collected-floor"
          # Read at run time, never interpolated, so a re-run after a body
          # edit sees the edit. A failed read is not an empty body: the
          # comparison decides what it means, and it matters only when tests
          # vanished from untouched files.
          num="${PR_NUMBER:-}"
          if [[ "$EVENT_NAME" == "push" ]]; then
            # The merged PR whose squash commit this push is.
            if ! num="$(gh api "repos/$REPO/commits/$SHA/pulls" \
                --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\") | .number] | first // empty")"; then
              echo "mode=unreadable" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -z "$num" ]]; then
              echo "mode=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if gh pr view "$num" --repo "$REPO" --json body -q .body > "$out/body.txt"; then
            echo "mode=file" >> "$GITHUB_OUTPUT"
          else
            echo "mode=unreadable" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare the collected ids
        env:
          MODE: ${{ steps.body.outputs.mode }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/collected-floor"
          case "$MODE" in
            file) body=(--body-file "$out/body.txt") ;;
            none) body=(--no-body) ;;
            *) body=(--body-unreadable) ;;
          esac
          python3 scripts/ci/collected_floor.py "$out/base.json" "$out/pr.json" \
            --changed "$out/changed.txt" "${body[@]}"
      # The full id sets, the changed-file list and both collection logs: the
      # step summary is budgeted, this is not.
      - name: Preserve the collected ids
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: collected-floor
          path: ${{ runner.temp }}/collected-floor/
          if-no-files-found: ignore
          retention-days: 14
