# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration.
#
# This file exists so the review behaviour is declared IN THE REPOSITORY rather
# than living only in a dashboard nobody can read from a checkout. Several of the
# values below match CodeRabbit's own defaults; they are written out anyway,
# because "the default happens to be what we want" and "we decided this" are
# different states, and only the second survives someone changing a default.
#
# Config on the DEFAULT branch governs every pull request. A copy on a feature
# branch does not take effect for that branch's own PR.

language: en-US

reviews:
  # chill = balanced. `assertive` produces more findings, most of them nitpicks;
  # this repo already runs a separate cross-model review, so the value here is
  # a second independent perspective, not volume.
  profile: chill

  auto_review:
    # Declared explicitly. CodeRabbit's default is already true, but the point of
    # this file is that the answer does not depend on a dashboard toggle.
    enabled: true
    # Re-review on each push. Without it, a review describes the first commit of
    # a PR and silently stops describing the branch after that — the same
    # stale-evidence failure the merge gate guards against elsewhere.
    auto_incremental_review: true
    # Drafts are work in progress by definition; reviewing them trains people to
    # ignore the reviewer.
    drafts: false

  # Excluded from review, not from the repo. Each of these is either machine-
  # generated or binary, so a reviewer comment on it can never be actionable.
  #
  # DOCUMENTATION is excluded for a different reason, and it is a deliberate
  # trade rather than an oversight: prose ships no behaviour, so a finding on it
  # cannot prevent a defect, while it costs exactly what a finding on code costs
  # — a review round, and a merge held. This reviewer's budget goes to the code.
  #
  # WHAT THIS GIVES UP, stated so it is a choice and not a discovery: this is the
  # reviewer that actually READS prose, so nothing automated now reads the
  # changelog or docs of a PUBLIC repo for an inadvertent disclosure. The CI leak
  # detector still scans every diff for known private patterns, and the pre-push
  # privacy review still runs, but those match PATTERNS — they do not read a
  # sentence and notice it reveals something. Keep that in mind when a docs PR
  # describes infrastructure.
  path_filters:
    - "!src/genesis/dashboard/webui/vendor/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!docs/images/**"
    - "!**/package-lock.json"
    # Documentation — see the note above. Filtered by EXTENSION, deliberately not
    # by directory: a blanket `!docs/**` would also hide anything under docs/ that
    # is not prose, and there is exactly such a file —
    # docs/genesis-architecture-interactive.html, a user-facing page linked from
    # the README that carries its own interaction logic. Excluding executable code
    # is not the trade that was made here; excluding prose is.
    # BOTH forms on purpose. Glob implementations disagree about whether `**/`
    # matches ZERO directories, so `**/*.md` alone may not cover a TOP-LEVEL file —
    # which is precisely CHANGELOG.md and AGENTS.md, the ones this exclusion exists
    # for. Betting on the matcher's semantics here would fail silently and look
    # like the filter simply not working.
    - "!*.md"
    - "!**/*.md"
    - "!*.rst"
    - "!**/*.rst"
    - "!*.adoc"
    - "!**/*.adoc"
    - "!*.asciidoc"
    - "!**/*.asciidoc"

  # One rule the merge gate depends on (REVIEW.md and AGENTS.md state the same rule).
  # The gate's always-fix floor reads a finding's severity LABEL, so a finding of one
  # of these three kinds labelled Minor merges like an ordinary nitpick.
  path_instructions:
    - path: "**"
      instructions: |
        Label a finding Critical, whatever its size, when it shows that the code: (1)
        leaks: the change exposes data that is actually private (personal data, a
        secret, a credential) to an audience beyond the one it is meant for, such as a
        commit, a PR, an issue, a public log or a published file; (2) destroys: it
        deletes or overwrites user data, or runs an irreversible operation nobody asked
        for, with no trash, backup or confirmation to recover from; (3) fails open: a
        check whose job is to stop data loss, credential exposure, deletion or an
        unreviewed merge lets the action through when it errors, times out or cannot
        read its input. Not every fail-open qualifies. A fail-open the code documents as
        deliberate (an advisory hook that must never wedge a session, for example) and a
        deliberate multi-step evasion of an accident-prevention guard are notes at most;
        the threat-model rule governs them. Put one line naming the kind, exactly
        "Kind: leak", "Kind: destructive" or "Kind: fail-open", as the first line of the
        finding's description: after your own severity header or badge, never ahead of
        it. The gate reads the label from the comment's first line, so a line ahead of
        the header hides the label.

  # The walkthrough is read at merge time; keep it to substance.
  poem: false
  high_level_summary: true

  # Do NOT auto-approve when comments are resolved. Merges in this repo require a
  # human approval by policy, and a bot approval that satisfies a required-review
  # rule would quietly remove that.
  request_changes_workflow: false
