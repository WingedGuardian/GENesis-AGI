# Genesis PII/infrastructure leak prevention rules.
#
# Extends gitleaks default rules (API keys, tokens, etc.). Install-specific
# NETWORK/HOST identifiers are deliberately NOT enumerated here: hardcoding
# this install's IPs/hostnames as detection patterns would publish, in the
# public repo, the very values the scanner exists to keep out. Those exact
# values live only in the local fingerprint file and the CI
# GENESIS_PRIVATE_PATTERNS secret (see ci.yml's private-pattern exact scan).
# Broad RFC1918/ULA CLASSES are surfaced as a NON-gating warning in CI
# (scripts/check_portability.sh --warn) so external contributors are never
# hard-blocked for a legitimate private-range example. gitleaks here keeps its
# generic secret/credential rules only.
#
# Allowlisted paths: test fixtures and scanner-definition files that may carry
# credential-shaped strings as data.

[extend]
useDefault = true

[[rules]]
id = "genesis-aws-account-id"
description = "AWS account ID near identifying keyword"
regex = '''(?i)(account.?id|aws.?account)[\s=:"']+\d{12}'''
tags = ["cloud", "genesis"]

# Global allowlist — paths that legitimately contain credential-shaped data
# (test fixtures) or embed pattern regexes as data (scanner definitions).
[allowlist]
paths = [
    '''tests/''',
    '''\.github/workflows/''',
    '''src/genesis/contribution/sanitize\.py''',
    '''scripts/hooks/commit-msg''',
    '''scripts/check_portability\.sh''',
    '''\.gitleaks\.toml''',
    '''secrets\.env\.example''',
]
